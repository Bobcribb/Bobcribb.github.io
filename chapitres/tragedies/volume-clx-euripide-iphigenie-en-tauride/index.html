<h1>Référence corrigée</h1><p>Cette étude intégrale possède une nouvelle référence. <a href="/chapitres/tragedies/volume-cxci-euripide-iphigenie-en-tauride/">Lire le texte intégral</a>.</p><script>location.replace("/chapitres/tragedies/volume-cxci-euripide-iphigenie-en-tauride/"+location.search+location.hash)</script></article><aside aria-label="Documents en rapport avec le sujet" class="mythos-home-illustrations mythos-bottom-gallery" data-editorial-gallery="subject-v3"><h2>Documents iconographiques</h2><figure data-media-id="mythos-met-361904-iphigenie-sacrifice-testa"><a aria-label="Agrandir : Grande estampe de Pietro Testa réunissant les acteurs du sacrifice d’Iphigénie et l’intervention divine." href="/assets/illustrations-articles/met-361904-iphigenie-sacrifice-testa.webp"><img alt="Grande estampe de Pietro Testa réunissant les acteurs du sacrifice d’Iphigénie et l’intervention divine." decoding="async" height="1322" loading="lazy" src="/assets/illustrations-articles/met-361904-iphigenie-sacrifice-testa.webp" width="1600"/></a><figcaption><strong>Le sacrifice d’Iphigénie dans la gravure baroque.</strong> Pietro Testa, vers 1640–1642, eau-forte et pointe sèche. Une interprétation moderne du récit d’Aulis, à comparer avec les variantes textuelles antiques. <a href="https://www.metmuseum.org/art/collection/search/361904">The Metropolitan Museum of Art, inv. 26.70.3(43)</a>. Image du domaine public, <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a>.</figcaption></figure><figure data-media-id="mythos-met-665702-iphigenie-gandolfi"><a aria-label="Agrandir : Peinture de Gandolfi montrant Iphigénie auprès de l’autel et l’apparition d’Artémis dans les nuées." href="/assets/illustrations-articles/met-665702-iphigenie-gandolfi.webp"><img alt="Peinture de Gandolfi montrant Iphigénie auprès de l’autel et l’apparition d’Artémis dans les nuées." decoding="async" height="1600" loading="lazy" src="/assets/illustrations-articles/met-665702-iphigenie-gandolfi.webp" width="1096"/></a><figcaption><strong>Artémis interrompt le sacrifice.</strong> Gaetano Gandolfi, 1789, huile sur toile préparatoire à un plafond de Bologne. La peinture retient la substitution d’une biche à Iphigénie ; elle appartient à la réception moderne du mythe. <a href="https://www.metmuseum.org/art/collection/search/665702">The Metropolitan Museum of Art, inv. 2015.46</a>. Image du domaine public, <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a>.</figcaption></figure><figure data-media-id="mythos-met-253340-iphigenie-aulis-bol-megarien"><a aria-label="Agrandir : Bol hellénistique dont le relief montre des personnages des épisodes d’Iphigénie à Aulis." href="/assets/illustrations-articles/met-253340-iphigenie-aulis-bol-megarien.webp"><img alt="Bol hellénistique dont le relief montre des personnages des épisodes d’Iphigénie à Aulis." decoding="async" height="1600" loading="lazy" src="/assets/illustrations-articles/met-253340-iphigenie-aulis-bol-megarien.webp" width="1600"/></a><figcaption><strong>Une tragédie racontée sur un vase.</strong> Bol béotien en terre cuite, IIe siècle av. n. è. Cinq scènes et des inscriptions renvoient à Iphigénie à Aulis d’Euripide, notamment à la lettre d’Agamemnon et à l’arrivée de sa famille. <a href="https://www.metmuseum.org/art/collection/search/253340">The Metropolitan Museum of Art, inv. 31.11.2</a>. Image du domaine public, <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a>.</figcaption></figure><figure data-media-id="mythos-met-820155-iphigenie-oreste-pylade-david"><a aria-label="Agrandir : Estampe montrant Iphigénie reconnaissant Oreste, en présence de Pylade, devant le lieu du sacrifice." href="/assets/illustrations-articles/met-820155-iphigenie-oreste-pylade-david.webp"><img alt="Estampe montrant Iphigénie reconnaissant Oreste, en présence de Pylade, devant le lieu du sacrifice." decoding="async" height="1199" loading="lazy" src="/assets/illustrations-articles/met-820155-iphigenie-oreste-pylade-david.webp" width="1600"/></a><figcaption><strong>Reconnaissance en Tauride.</strong> Giovanni David, 1776, eau-forte. Iphigénie reconnaît son frère Oreste au moment où elle doit le sacrifier. Cette composition moderne illustre le renversement dramatique du récit. <a href="https://www.metmuseum.org/art/collection/search/820155">The Metropolitan Museum of Art, inv. 2019.381</a>. Image du domaine public, <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a>.</figcaption></figure><figure data-media-id="mythos-euripide-portrait-antique-szilas"><a aria-label="Agrandir : Portrait sculpté d’Euripide en marbre, visage barbu et cheveux longs, présenté sur un support moderne." href="/assets/illustrations-articles/euripide-portrait-antique-szilas.webp"><img alt="Portrait sculpté d’Euripide en marbre, visage barbu et cheveux longs, présenté sur un support moderne." decoding="async" height="1600" loading="lazy" src="/assets/illustrations-articles/euripide-portrait-antique-szilas.webp" width="778"/></a><figcaption><strong>Portrait antique d’Euripide.</strong> Copie romaine en marbre du Ier siècle de n. è., d’après un modèle grec du IVe siècle av. n. è. Photographie prise lors d’une exposition au Colisée ; œuvre provenant des collections du Musée archéologique national de Naples. <a href="https://commons.wikimedia.org/wiki/File:Portrait_of_Euripides,_Colosseum.jpg">Photo Szilas, 4 mars 2013, Wikimedia Commons</a>, placée dans le domaine public par son auteur. Réduction proportionnelle et conversion WebP, sans recadrage. Ce portrait est postérieur à la vie du poète.</figcaption></figure></aside></main>
