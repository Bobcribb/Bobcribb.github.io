<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="titre desc"><title id="titre">Énéide II — Fuir la destruction</title><desc id="desc">Enéide II : destruction de Troie, sauvegarde d’Anchise et d’Ascagne, perte de Créuse et départ en exil. Schéma pédagogique moderne, non illustration antique.</desc><rect width="1200" height="620" fill="#101719"/><rect x="16" y="16" width="1168" height="588" rx="13" fill="none" stroke="#856945" stroke-width="2"/><text x="600" y="73" text-anchor="middle" font-size="37" font-family="Georgia,serif" fill="#e9cfa1">Énéide II — Fuir la destruction</text><text x="600" y="116" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" fill="#ddd3c3">Du devoir familial à la perte irréparable</text><rect x="45" y="171" width="258" height="298" rx="12" fill="#202b2d" stroke="#aa8a61" stroke-width="2"/><text x="174" y="225" text-anchor="middle" font-size="30" font-family="Georgia,serif" fill="#e9cfa1">1</text><path d="M73 250 H275" stroke="#856945" stroke-width="1"/><text x="174" y="303" text-anchor="middle" font-size="19" font-weight="bold" font-family="Arial,sans-serif" fill="#e9cfa1">DÉPART</text><text x="174" y="363" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#ebdfcc">Troie en flammes</text><text x="174" y="406" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#ebdfcc">L’appel à fuir</text><rect x="323" y="171" width="258" height="298" rx="12" fill="#202b2d" stroke="#aa8a61" stroke-width="2"/><text x="452" y="225" text-anchor="middle" font-size="30" font-family="Georgia,serif" fill="#e9cfa1">2</text><path d="M351 250 H553" stroke="#856945" stroke-width="1"/><text x="452" y="303" text-anchor="middle" font-size="19" font-weight="bold" font-family="Arial,sans-serif" fill="#e9cfa1">TRANSMISSION</text><text x="452" y="363" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#ebdfcc">Anchise porté</text><text x="452" y="406" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#ebdfcc">Ascagne guidé</text><rect x="601" y="171" width="258" height="298" rx="12" fill="#202b2d" stroke="#aa8a61" stroke-width="2"/><text x="730" y="225" text-anchor="middle" font-size="30" font-family="Georgia,serif" fill="#e9cfa1">3</text><path d="M629 250 H831" stroke="#856945" stroke-width="1"/><text x="730" y="303" text-anchor="middle" font-size="19" font-weight="bold" font-family="Arial,sans-serif" fill="#e9cfa1">ABSENCE</text><text x="730" y="363" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#ebdfcc">Créuse perdue</text><text x="730" y="406" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#ebdfcc">La famille incomplète</text><rect x="879" y="171" width="258" height="298" rx="12" fill="#202b2d" stroke="#aa8a61" stroke-width="2"/><text x="1008" y="225" text-anchor="middle" font-size="30" font-family="Georgia,serif" fill="#e9cfa1">4</text><path d="M907 250 H1109" stroke="#856945" stroke-width="1"/><text x="1008" y="303" text-anchor="middle" font-size="19" font-weight="bold" font-family="Arial,sans-serif" fill="#e9cfa1">EXIL</text><text x="1008" y="363" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#ebdfcc">Terre à chercher</text><text x="1008" y="406" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#ebdfcc">Le passé à transmettre</text><text x="600" y="534" text-anchor="middle" font-size="18" font-family="Georgia,serif" fill="#e9cfa1">Séquence de lecture critique : les étapes ne sont pas des faits historiques.</text><text x="600" y="578" text-anchor="middle" font-size="16" font-family="Arial,sans-serif" fill="#b6aa94">Virgile, Énéide · schéma 2D original MYTHOS · novembre 2026</text></svg>