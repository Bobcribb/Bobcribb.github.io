<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="titre desc"><title id="titre">L’Énéide : douze livres, deux mouvements</title><desc id="desc">Schéma de l’Énéide de Virgile : livres I à VI, voyages d’Énée, et livres VII à XII, guerre dans le Latium.</desc><rect width="1200" height="620" fill="#101719"/><rect x="15" y="15" width="1170" height="590" rx="16" fill="none" stroke="#82694a" stroke-width="2"/><text x="600" y="70" text-anchor="middle" font-family="Georgia,serif" font-size="37" fill="#efd2a0">L’Énéide : douze livres, deux mouvements</text><text x="600" y="109" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#d4c7b5">Voyage, guerre et héritage homérique dans une épopée romaine</text><rect x="42" y="169" width="548" height="315" rx="12" fill="#20292a" stroke="#ad8b5b" stroke-width="2"/><text x="316" y="224" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#f1d6a4">I–VI</text><text x="316" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#f3e7d3">VOYAGES ET EXIL</text><text x="316" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e5d7c3">Fuite après Troie</text><text x="316" y="369" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e5d7c3">Didon et Carthage</text><text x="316" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e5d7c3">Descente aux Enfers</text><rect x="610" y="169" width="548" height="315" rx="12" fill="#20292a" stroke="#ad8b5b" stroke-width="2"/><text x="884" y="224" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#f1d6a4">VII–XII</text><text x="884" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#f3e7d3">GUERRE DANS LE LATIUM</text><text x="884" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fi