<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="titre desc"><title id="titre">Gilgamesh : de la gloire à la finitude</title><desc id="desc">Schéma narratif de l’Épopée de Gilgamesh : amitié d’Enkidu, épreuves, mort et quête des limites humaines.</desc><rect width="1200" height="620" fill="#101719"/><rect x="15" y="15" width="1170" height="590" rx="16" fill="none" stroke="#82694a" stroke-width="2"/><text x="600" y="70" text-anchor="middle" font-family="Georgia,serif" font-size="37" fill="#efd2a0">Gilgamesh : de la gloire à la finitude</text><text x="600" y="109" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#d4c7b5">Une lecture narrative, non une chronologie du monde ancien</text><rect x="42" y="169" width="264" height="315" rx="12" fill="#20292a" stroke="#ad8b5b" stroke-width="2"/><text x="174" y="224" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#f1d6a4">I</text><text x="174" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#f3e7d3">URUK</text><text x="174" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e5d7c3">Le roi Gilgamesh</text><text x="174" y="369" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e5d7c3">Enkidu et l’amitié</text><text x="174" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e5d7c3">Vie de la cité</text><rect x="326" y="169" width="264" height="315" rx="12" fill="#20292a" stroke="#ad8b5b" stroke-width="2"/><text x="458" y="224" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#f1d6a4">II</text><text x="458" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#f3e7d3">LES ÉPREUVES</text><text x="458" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e5d7c3">Aventures héroïques</text><text x="458" y="369" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e5d7c3">Forêt des Cèdres</text><text x="458" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e5d7c3">Taureau céleste</text><rect x="610" y="169" width="264" height="315" rx="12" fill="#20292a" stroke="#ad8b5b" stroke-width="2"/><text x="742" y="224" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#f1d6a4">III</text><text x="742" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#f3e7d3">LE DEUIL</text><text x="742" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e5d7c3">Mort d’Enkidu</text><text x="742" y="369" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e5d7c3">Effroi devant la mort</text><text x="742" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e5d7c3">Départ de Gilgamesh</text><rect x="894" y="169" width="264" height="315" rx="12" fill="#20292a" stroke="#ad8b5b" stroke-width="2"/><text x="1026" y="224" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#f1d6a4">IV</text><text x="1026" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#f3e7d3">LA LIMITE</text><text x="1026" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e5d7c3">Uta-napishti</text><text x="1026" y="369" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e5d7c3">Récit du Déluge</text><text x="1026" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#e5d7c3">Retour à Uruk</text><text x="600" y="542" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#e2c79b">Schéma de lecture de l’épopée standard ; les versions et tablettes diffèrent.</text><text x="600" y="578" text-anchor="middle" font-family="Arial,sans-serif" font-size="16"