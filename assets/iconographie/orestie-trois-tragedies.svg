<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="titre desc"><title id="titre">L’Orestie : trois tragédies, une crise de justice</title><desc id="desc">Schéma de la trilogie de l’Orestie d’Eschyle : Agamemnon, les Choéphores et les Euménides.</desc><rect width="1200" height="620" fill="#101719"/><rect x="15" y="15" width="1170" height="590" rx="16" fill="none" stroke="#82694a" stroke-width="2"/><text x="600" y="70" text-anchor="middle" font-family="Georgia,serif" font-size="37" fill="#efd2a0">L’Orestie : trois tragédies, une crise de justice</text><text x="600" y="109" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#d4c7b5">Trilogie d’Eschyle représentée en 458 av. notre ère</text><rect x="42" y="169" width="358.6666666666667" height="315" rx="12" fill="#20292a" stroke="#ad8b5b" stroke-width="2"/><text x="221.33333333333334" y="224" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#f1d6a4">I</text><text x="221.33333333333334" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#f3e7d3">AGAMEMNON</text><text x="221.33333333333334" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e5d7c3">Retour du roi</text><text x="221.33333333333334" y="369" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e5d7c3">Meurtre dans le palais</text><text x="221.33333333333334" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e5d7c3">La maison des Atrides</text><rect x="420.6666666666667" y="169" width="358.6666666666667" height="315" rx="12" fill="#20292a" stroke="#ad8b5b" stroke-width="2"/><text x="600" y="224" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#f1d6a4">II</text><text x="600" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#f3e7d3">LES CHOÉPHORES</text><text x="600" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e5d7c3">Oreste et Électre</text><text x="600" y="369" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e5d7c3">Vengeance du père</text><text x="600" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e5d7c3">Violence renouvelée</text><rect x="799.3333333333334" y="169" width="358.6666666666667" height="315" rx="12" fill="#20292a" stroke="#ad8b5b" stroke-width="2"/><text x="978.6666666666667" y="224" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#f1d6a4">III</text><text x="978.6666666666667" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#f3e7d3">LES EUMÉNIDES</text><text x="978.6666666666667" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e5d7c3">Poursuite d’Oreste</text><text x="978.6666666666667" y="369" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e5d7c3">Affrontement des droits</text><text x="978.6666666666667" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e5d7c3">Arbitrage à Athènes</text><text x="600" y="542" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#e2c79b">Progression dramaturgique : une fiction tragique, non le récit d’un procès historique.</text><text x="600" y="578" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#b9ad99">MYTHOS · schéma de synthèse original 2D · novembre 2026 · représentation non antique</text></svg>