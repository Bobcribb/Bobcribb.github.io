<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620" role="img" aria-labelledby="title description"><title id="title">Jeux funèbres · la justice en débat</title><desc id="description">Iliade, chant XXIII · course des chars et arbitrages. CLASSEMENT: Diomède est premier.: Antiloque arrive deuxième.: Un ordre de prix est établi.. COMPENSATION: Eumélos a subi un accident.: Achille lui offre un autre bien: sans retirer le prix d’Antiloque.. RÉCONCILIATION: Ménélas conteste une manœuvre.: Antiloque reconnaît son tort.: Le prix lui est finalement laissé.. Trois critères distincts : résultat · équité · restauration du lien</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop offset="0" stop-color="#071012"/><stop offset="1" stop-color="#172021"/></linearGradient></defs><rect width="1320" height="620" fill="url(#bg)"/><path d="M32 30h1256v560H32z" fill="none" stroke="#665940" stroke-width="2"/><path d="M42 132h1236" stroke="#b0925f" stroke-width="1"/><text x="660" y="77" font-family="Georgia,'Times New Roman',serif" text-anchor="middle" font-size="38" fill="#f3d8a4">Jeux funèbres · la justice en débat</text><text x="660" y="113" font-family="Arial,sans-serif" text-anchor="middle" font-size="20" fill="#ded4c2">Iliade, chant XXIII · course des chars et arbitrages</text><g font-family="Arial,Helvetica,sans-serif"><g><rect x="42" y="190" width="397.3333333333333" height="286" rx="13" fill="#1b2425" stroke="#a88b59" stroke-width="2"/><rect x="58" y="208" width="5" height="42" rx="2" fill="#d4b47e"/><text x="77" y="241" font-size="24" font-weight="700" fill="#f2d8a2">CLASSEMENT</text><path d="M60 268h361.3333333333333" stroke="#53605b" stroke-width="1"/><text x="63" y="310" font-size="21" fill="#e4dfd3">Diomède est premier.</text><text x="63" y="346" font-size="21" fill="#e4dfd3">Antiloque arrive deuxième.</text><text x="63" y="382" font-size="21" fill="#e4dfd3">Un ordre de prix est établi.</text></g><g><rect x="461.3333333333333" y="190" width="397.3333333333333" height="286" rx="13" fill="#1b2425" stroke="#a88b59" stroke-width="2"/><rect x="477.3333333333333" y="208" width="5" height="42" rx="2" fill="#d4b47e"/><text x="496.3333333333333" y="241" font-size="24" font-weight="700" fill="#f2d8a2">COMPENSATION</text><path d="M479.3333333333333 268h361.3333333333333" stroke="#53605b" stroke-width="1"/><text x="482.3333333333333" y="310" font-size="21" fill="#e4dfd3">Eumélos a subi un accident.</text><text x="482.3333333333333" y="346" font-size="21" fill="#e4dfd3">Achille lui offre un autre bien</text><text x="482.3333333333333" y="382" font-size="21" fill="#e4dfd3">sans retirer le prix d’Antiloque.</text></g><g><rect x="880.6666666666666" y="190" width="397.3333333333333" height="286" rx="13" fill="#1b2425" stroke="#a88b59" stroke-width="2"/><rect x="896.6666666666666" y="208" width="5" height="42" rx="2" fill="#d4b47e"/><text x="915.6666666666666" y="241" font-size="24" font-weight="700" fill="#f2d8a2">RÉCONCILIATION</text><path d="M898.6666666666666 268h361.3333333333333" stroke="#53605b" stroke-width="1"/><text x="901.6666666666666" y="310" font-size="21" fill="#e4dfd3">Ménélas conteste une manœuvre.</text><text x="901.6666666666666" y="346" font-size="21" fill="#e4dfd3">Antiloque reconnaît son tort.</text><text x="901.6666666666666" y="382" font-size="21" fill="#e4dfd3">Le prix lui est finalement laissé.</text></g></g><rect x="65" y="505" width="1190" height="49" rx="6" fill="#40372a" stroke="#9c8157"/><text x="660" y="537" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#f2e0c2">Trois critères distincts : résultat · équité · restauration du lien</text><text x="660" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#baa992">Homère, Iliade XXIII, 534–650 · MYTHOS 2026 · illustration interprétative contemporaine, assistée par IA</text></svg>
