<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Atê et Litaí : deux rythmes de la réparation</title><desc id="desc">Dans le discours de Phénix, Atê, l'égarement destructeur, court en avant ; les Prières, filles de Zeus, suivent plus lentement. Les accueillir ou les repousser entraîne deux issues possibles.</desc><metadata>MYTHOS ; 6 novembre 2026 ; séance 74 ; schéma original 2D élaboré avec assistance IA ; interprétation contemporaine, non artefact ancien ; Homère, Iliade IX, 502–514</metadata><rect width="1200" height="690" fill="#0b151d"/><rect x="18" y="18" width="1164" height="654" fill="none" stroke="#b69661" stroke-width="2"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="50" y="56" font-size="18" letter-spacing="3" font-weight="700" fill="#e6c382">MYTHOS   /   DOSSIER PHILOLOGIQUE   /   06.11.2026</text><text x="50" y="110" font-size="33" font-weight="700" fill="#f8edda">Atê et Litaí : deux rythmes de la réparation</text><text x="50" y="155" font-size="21" fill="#b6cbd1" font-weight="400">Discours de Phénix à Achille · personnifications et choix humain</text><rect x="52" y="198" width="310" height="132" rx="10" fill="#1a2933" stroke="#e7a69a" stroke-width="2"/><text x="73" y="242" font-size="24" fill="#e7a69a" font-weight="700">ATÊ · l’égarement</text><text x="73" y="281" font-size="20" fill="#f8edda" font-weight="400">Va vite ; cause un tort</text><text x="73" y="307" font-size="18" fill="#f8edda" font-weight="400">avant la réparation.</text><path d="M380 264 L441 264" fill="none" stroke="#e7a69a" stroke-width="4" stroke-linecap="round"/><path d="M430 256 L441 264 L430 272" fill="none" stroke="#e7a69a" stroke-width="3" stroke-linecap="round"/><rect x="457" y="198" width="310" height="132" rx="10" fill="#1a2933" stroke="#e7a69a" stroke-width="2"/><text x="478" y="243" font-size="22" fill="#e7a69a" font-weight="700">TORT DÉJÀ CAUSÉ</text><text x="478" y="280" font-size="19" fill="#f8edda" font-weight="400">La faute a des effets</text><text x="478" y="306" font-size="19" fill="#f8edda" font-weight="400">sur les relations.</text><text x="805" y="243" font-size="19" fill="#b6cbd1" font-weight="400">L’offense précède</text><text x="805" y="274" font-size="19" fill="#b6cbd1" font-weight="400">la médiation</text><text x="52" y="375" font-size="20" fill="#e6c382" font-weight="400">Les Litaí ne suppriment pas l’offense : elles cherchent à la soigner.</text><rect x="52" y="400" width="310" height="154" rx="10" fill="#1a2933" stroke="#e6c382" stroke-width="2"/><text x="73" y="442" font-size="23" fill="#e6c382" font-weight="700">LITAÍ · les Prières</text><text x="73" y="480" font-size="19" fill="#f8edda" font-weight="400">Avancent lentement ;</text><text x="73" y="507" font-size="19" fill="#f8edda" font-weight="400">sollicitent l’accueil.</text><path d="M380 473 L441 473" fill="none" stroke="#e6c382" stroke-width="4" stroke-linecap="round"/><path d="M430 465 L441 473 L430 481" fill="none" stroke="#e6c382" stroke-width="3" stroke-linecap="round"/><rect x="457" y="399" width="316" height="154" rx="10" fill="#1a2933" stroke="#a5cfbd" stroke-width="2"/><text x="479" y="442" font-size="22" fill="#a5cfbd" font-weight="700">ACCUEILLIR</text><text x="479" y="480" font-size="19" fill="#f8edda" font-weight="400">Possibilité d’une</text><text x="479" y="506" font-size="19" fill="#f8edda" font-weight="400">réparation.</text><rect x="793" y="399" width="348" height="154" rx="10" fill="#1a2933" stroke="#e7a69a" stroke-width="2"/><text x="816" y="442" font-size="22" fill="#e7a69a" font-weight="700">REPOUSSER</text><text x="816" y="479" font-size="19" fill="#f8edda" font-weight="400">Le tort peut se prolonger ;</text><text x="816" y="506" font-size="19" fill="#f8edda" font-weight="400">l’offense appelle un coût.</text><text x="51" y="590" font-size="18" fill="#b6cbd1" font-weight="400">Le discours est une exhortation située, non une loi universelle du pardon.</text><text x="50" y="627" font-size="17" fill="#e6c382" font-weight="400">Homère, Iliade IX, v. 502–514 (Phénix).</text><text x="50" y="656" font-size="16" fill="#b6cbd1" font-weight="400">Schéma interprétatif 2D avec assistance IA · aucune image d’artefact antique</text></g></svg>
