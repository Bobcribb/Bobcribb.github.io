<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620" role="img" aria-labelledby="title description"><title id="title">Le serment sur l’eau de Styx</title><desc id="description">Théogonie, v. 775–806 · ordre divin et sanction du parjure. 01 · PROCÉDURE: Sur ordre de Zeus, Iris: apporte l’eau sacrée de Styx.. 02 · PARJURE: Un dieu prononce un faux serment: sur cette eau.. 03 · PREMIÈRE PEINE: Une année d’inertie,: sans nectar ni ambroisie.. 04 · EXCLUSION: Neuf ans hors des conseils: et des banquets des dieux.. À la dixième année : retour parmi les immortels</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop offset="0" stop-color="#071012"/><stop offset="1" stop-color="#172021"/></linearGradient></defs><rect width="1320" height="620" fill="url(#bg)"/><path d="M32 30h1256v560H32z" fill="none" stroke="#665940" stroke-width="2"/><path d="M42 132h1236" stroke="#b0925f" stroke-width="1"/><text x="660" y="77" font-family="Georgia,'Times New Roman',serif" text-anchor="middle" font-size="38" fill="#f3d8a4">Le serment sur l’eau de Styx</text><text x="660" y="113" font-family="Arial,sans-serif" text-anchor="middle" font-size="20" fill="#ded4c2">Théogonie, v. 775–806 · ordre divin et sanction du parjure</text><g font-family="Arial,Helvetica,sans-serif"><g><rect x="42" y="190" width="292.5" height="286" rx="13" fill="#1b2425" stroke="#a88b59" stroke-width="2"/><rect x="58" y="208" width="5" height="42" rx="2" fill="#d4b47e"/><text x="77" y="241" font-size="21" font-weight="700" fill="#f2d8a2">01 · PROCÉDURE</text><path d="M60 268h256.5" stroke="#53605b" stroke-width="1"/><text x="63" y="310" font-size="19" fill="#e4dfd3">Sur ordre de Zeus, Iris</text><text x="63" y="346" font-size="19" fill="#e4dfd3">apporte l’eau sacrée de Styx.</text></g><g><rect x="356.5" y="190" width="292.5" height="286" rx="13" fill="#1b2425" stroke="#a88b59" stroke-width="2"/><rect x="372.5" y="208" width="5" height="42" rx="2" fill="#d4b47e"/><text x="391.5" y="241" font-size="21" font-weight="700" fill="#f2d8a2">02 · PARJURE</text><path d="M374.5 268h256.5" stroke="#53605b" stroke-width="1"/><text x="377.5" y="310" font-size="19" fill="#e4dfd3">Un dieu prononce un faux serment</text><text x="377.5" y="346" font-size="19" fill="#e4dfd3">sur cette eau.</text></g><g><rect x="671" y="190" width="292.5" height="286" rx="13" fill="#1b2425" stroke="#a88b59" stroke-width="2"/><rect x="687" y="208" width="5" height="42" rx="2" fill="#d4b47e"/><text x="706" y="241" font-size="21" font-weight="700" fill="#f2d8a2">03 · PREMIÈRE PEINE</text><path d="M689 268h256.5" stroke="#53605b" stroke-width="1"/><text x="692" y="310" font-size="19" fill="#e4dfd3">Une année d’inertie,</text><text x="692" y="346" font-size="19" fill="#e4dfd3">sans nectar ni ambroisie.</text></g><g><rect x="985.5" y="190" width="292.5" height="286" rx="13" fill="#1b2425" stroke="#a88b59" stroke-width="2"/><rect x="1001.5" y="208" width="5" height="42" rx="2" fill="#d4b47e"/><text x="1020.5" y="241" font-size="21" font-weight="700" fill="#f2d8a2">04 · EXCLUSION</text><path d="M1003.5 268h256.5" stroke="#53605b" stroke-width="1"/><text x="1006.5" y="310" font-size="19" fill="#e4dfd3">Neuf ans hors des conseils</text><text x="1006.5" y="346" font-size="19" fill="#e4dfd3">et des banquets des dieux.</text></g></g><rect x="65" y="505" width="1190" height="49" rx="6" fill="#40372a" stroke="#9c8157"/><text x="660" y="537" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#f2e0c2">À la dixième année : retour parmi les immortels</text><text x="660" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#baa992">Hésiode, Théogonie, v. 775–806 · MYTHOS 2026 · illustration interprétative contemporaine, assistée par IA</text></svg>
