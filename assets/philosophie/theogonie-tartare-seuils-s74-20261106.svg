<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Ciel, terre, Tartare : une profondeur racontée</title><desc id="desc">Hésiode fait imaginer une enclume de bronze tombant neuf jours et neuf nuits pour atteindre la terre depuis le ciel, puis autant pour atteindre le Tartare depuis la terre. Il s'agit d'une mesure poétique et non d'une coupe géologique.</desc><metadata>MYTHOS ; 6 novembre 2026 ; séance 74 ; schéma original 2D élaboré avec assistance IA ; interprétation contemporaine, non artefact ancien ; Hésiode, Théogonie 713–735 et 736–819</metadata><rect width="1200" height="690" fill="#0b151d"/><rect x="18" y="18" width="1164" height="654" fill="none" stroke="#b69661" stroke-width="2"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="50" y="56" font-size="18" letter-spacing="3" font-weight="700" fill="#e6c382">MYTHOS   /   DOSSIER PHILOLOGIQUE   /   06.11.2026</text><text x="50" y="110" font-size="33" font-weight="700" fill="#f8edda">Ciel, terre, Tartare : une profondeur racontée</text><text x="50" y="155" font-size="20" fill="#b6cbd1" font-weight="400">Chute de l’enclume : analogie narrative, distances sans échelle</text><rect x="62" y="185" width="484" height="100" rx="10" fill="#1a2933" stroke="#b69661" stroke-width="2"/><text x="84" y="226" font-size="23" fill="#e6c382" font-weight="700">CIEL ÉTOILÉ</text><text x="84" y="256" font-size="18" fill="#f8edda" font-weight="400">Point de départ de l’image</text><rect x="62" y="347" width="484" height="100" rx="10" fill="#1a2933" stroke="#b69661" stroke-width="2"/><text x="84" y="390" font-size="24" fill="#f8edda" font-weight="700">TERRE</text><text x="84" y="417" font-size="18" fill="#f8edda" font-weight="400">Point de passage dans la comparaison</text><rect x="62" y="510" width="484" height="99" rx="10" fill="#1a2933" stroke="#b69661" stroke-width="2"/><text x="84" y="550" font-size="23" fill="#e7a69a" font-weight="700">TARTARE</text><text x="84" y="580" font-size="18" fill="#f8edda" font-weight="400">Région de clôture des Titans</text><path d="M306 288 L306 343" fill="none" stroke="#e6c382" stroke-width="4" stroke-linecap="round"/><path d="M295 335 L306 343 L295 351" fill="none" stroke="#e6c382" stroke-width="3" stroke-linecap="round"/><path d="M306 450 L306 506" fill="none" stroke="#e6c382" stroke-width="4" stroke-linecap="round"/><path d="M295 498 L306 506 L295 514" fill="none" stroke="#e6c382" stroke-width="3" stroke-linecap="round"/><text x="332" y="309" font-size="16" fill="#e6c382" font-weight="400">9 jours et 9 nuits</text><text x="332" y="329" font-size="16" fill="#e6c382" font-weight="400">→ dixième jour</text><text x="332" y="471" font-size="16" fill="#e6c382" font-weight="400">9 jours et 9 nuits</text><text x="332" y="491" font-size="16" fill="#e6c382" font-weight="400">→ dixième jour</text><rect x="608" y="204" width="530" height="348" rx="10" fill="#1a2933" stroke="#e6c382" stroke-width="2"/><text x="638" y="254" font-size="23" fill="#e6c382" font-weight="700">LES SEUILS DU POUVOIR</text><text x="638" y="307" font-size="21" fill="#f8edda" font-weight="400">Portes de bronze et enceinte</text><text x="638" y="355" font-size="21" fill="#f8edda" font-weight="400">Titans retenus au Tartare</text><text x="638" y="404" font-size="21" fill="#f8edda" font-weight="400">Les Cent-Bras sont gardiens</text><path d="M639 430 L1110 430" stroke="#b69661" stroke-width="2" stroke-dasharray="6 6"/><text x="638" y="463" font-size="19" fill="#b6cbd1" font-weight="400">Limites du cosmos poétique</text><text x="638" y="491" font-size="19" fill="#b6cbd1" font-weight="400">≠ plan archéologique</text><text x="50" y="627" font-size="17" fill="#e6c382" font-weight="400">Hésiode, Théogonie v. 713–735 et 736–819.</text><text x="50" y="656" font-size="16" fill="#b6cbd1" font-weight="400">Schéma interprétatif 2D avec assistance IA · aucune image d’artefact antique</text></g></svg>
