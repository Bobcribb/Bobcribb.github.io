<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="title desc"><title id="title">Οὖτις : le nom qui protège et expose</title><desc id="desc">Du nom d'emprunt à la malédiction de Polyphème. Trois étapes explicitées dans la légende de l'étude.</desc><metadata>MYTHOS 5 novembre 2026. Schéma original 2D réalisé avec assistance IA ; création contemporaine, non historique, ne reproduisant aucun artefact antique. Homère, Odyssée IX, v. 364–414 et 500–536</metadata><rect width="1200" height="650" fill="#0e171e"/><rect x="17" y="17" width="1166" height="616" fill="none" stroke="#987e51" stroke-width="2"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="55" y="68" fill="#d5b476" font-size="18" font-weight="bold">MYTHOS · DOCUMENT CRITIQUE · 2026</text><text x="55" y="122" fill="#f8ecd6" font-size="32" font-weight="bold">Οὖτις : le nom qui protège et expose</text><text x="55" y="166" fill="#bfd2d0" font-size="21">Du nom d'emprunt à la malédiction de Polyphème</text><rect x="55" y="231" width="335" height="244" rx="16" fill="#192b35" stroke="#ad905e" stroke-width="2"/><text x="73" y="269" fill="#dfb978" font-size="24" font-weight="bold">01</text><text x="73" y="318" fill="#f9ebd3" font-size="20" font-weight="bold">NOM D'EMPRUNT</text><text x="73" y="381" fill="#e6eddf" font-size="21">Ulysse devient</text><text x="73" y="418" fill="#e6eddf" font-size="21">« Personne ».</text><rect x="437" y="231" width="335" height="244" rx="16" fill="#192b35" stroke="#ad905e" stroke-width="2"/><text x="455" y="269" fill="#dfb978" font-size="24" font-weight="bold">02</text><text x="455" y="318" fill="#f9ebd3" font-size="20" font-weight="bold">APPEL AMBIGU</text><text x="455" y="381" fill="#e6eddf" font-size="21">Les Cyclopes n'entendent</text><text x="455" y="418" fill="#e6eddf" font-size="21">aucun agresseur.</text><rect x="819" y="231" width="335" height="244" rx="16" fill="#192b35" stroke="#ad905e" stroke-width="2"/><text x="837" y="269" fill="#dfb978" font-size="24" font-weight="bold">03</text><text x="837" y="318" fill="#f9ebd3" font-size="20" font-weight="bold">RENOM DÉVOILÉ</text><text x="837" y="381" fill="#e6eddf" font-size="21">Ulysse se nomme ;</text><text x="837" y="418" fill="#e6eddf" font-size="21">la prière le cible.</text><text x="55" y="531" fill="#e1ddca" font-size="18">La ruse du nom protège ; la recherche du renom compromet le retour.</text><text x="55" y="580" fill="#d5b476" font-size="17">Homère, Odyssée IX, v. 364–414 et 500–536</text><text x="55" y="616" fill="#bdc9c6" font-size="16">Schéma vectoriel assisté par IA · non historique · non archéologique</text></g></svg>
