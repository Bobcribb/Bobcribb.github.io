<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc" width="1320" height="680" viewBox="0 0 1320 680"><title id="svg-title">Argos : reconnaissance sans discours</title><desc id="svg-desc">Homère, Odyssée XVII, 290–327 · une scène du retour Traces du passé: Chien jadis élevé, par Ulysse ; longue absence ;, abandon devant le palais ;, épuisement du corps.. Le signe: Argos perçoit son maître ;, queue et oreilles remuent ;, Ulysse détourne le visage ;, une larme reste cachée.. La perte: Eumée croit le maître mort ;, aucun dévoilement public ;, Argos meurt après l’avoir vu ;, le retour arrive trop tard. L’identité est reconnue, mais le lien ne peut plus redevenir une vie commune.</desc><rect width="1320" height="680" fill="#0d161d"/><rect x="19" y="19" width="1282" height="642" rx="10" fill="none" stroke="#836947" stroke-width="2"/><text x="660" y="78" text-anchor="middle" font-family="Georgia,serif" font-size="40" fill="#f4d8aa">Argos : reconnaissance sans discours</text><text x="660" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#d0c5b3">Homère, Odyssée XVII, 290–327 · une scène du retour</text><rect x="46" y="164" width="388" height="374" rx="10" fill="#1c282e" stroke="#b38b54" stroke-width="2"/><text x="70" y="204" font-family="Arial,sans-serif" font-size="16" letter-spacing="3" fill="#d0b17d">ÉTAPE 1</text><text x="70" y="265" font-family="Georgia,serif" font-size="30" fill="#f3d5a0">Traces du passé</text><path d="M70 284h340" stroke="#776548" stroke-width="2"/><text x="70" y="334" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">Chien jadis élevé</text><text x="70" y="377" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">par Ulysse ; longue absence ;</text><text x="70" y="420" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">abandon devant le palais ;</text><text x="70" y="463" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">épuisement du corps.</text><rect x="466" y="164" width="388" height="374" rx="10" fill="#1c282e" stroke="#b38b54" stroke-width="2"/><text x="490" y="204" font-family="Arial,sans-serif" font-size="16" letter-spacing="3" fill="#d0b17d">ÉTAPE 2</text><text x="490" y="265" font-family="Georgia,serif" font-size="30" fill="#f3d5a0">Le signe</text><path d="M490 284h340" stroke="#776548" stroke-width="2"/><text x="490" y="334" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">Argos perçoit son maître ;</text><text x="490" y="377" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">queue et oreilles remuent ;</text><text x="490" y="420" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">Ulysse détourne le visage ;</text><text x="490" y="463" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">une larme reste cachée.</text><rect x="886" y="164" width="388" height="374" rx="10" fill="#1c282e" stroke="#b38b54" stroke-width="2"/><text x="910" y="204" font-family="Arial,sans-serif" font-size="16" letter-spacing="3" fill="#d0b17d">ÉTAPE 3</text><text x="910" y="265" font-family="Georgia,serif" font-size="30" fill="#f3d5a0">La perte</text><path d="M910 284h340" stroke="#776548" stroke-width="2"/><text x="910" y="334" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">Eumée croit le maître mort ;</text><text x="910" y="377" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">aucun dévoilement public ;</text><text x="910" y="420" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">Argos meurt après l’avoir vu ;</text><text x="910" y="463" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">le retour arrive trop tard.</text><text x="660" y="589" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#e7d3b2">L’identité est reconnue, mais le lien ne peut plus redevenir une vie commune.</text><text x="660" y="635" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#b9ac97">MYTHOS · schéma interprétatif 2D · 4 novembre 2026 · sans reproduction d’artefact</text></svg>