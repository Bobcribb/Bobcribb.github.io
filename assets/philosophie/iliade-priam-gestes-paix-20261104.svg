<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1320 710" width="1320" height="710">
<title id="title">Priam et Achille : quatre moments de la restitution du corps d’Hector</title>
<desc id="description">Chronologie analytique du chant XXIV de l’Iliade : supplication de Priam, lamentations de Priam et Achille, remise du corps et trêve pour les funérailles. Schéma contemporain, non document antique.</desc>
<rect width="1320" height="710" fill="#10191c"/>
<rect x="16" y="16" width="1288" height="678" rx="9" fill="none" stroke="#9a7850" stroke-width="2"/>
<text x="64" y="78" font-size="40" font-family="Georgia,serif" fill="#f1dbb2">Du deuil à une suspension de la violence</text>
<text x="65" y="120" font-size="22" font-family="Arial,sans-serif" fill="#d5c6ac">Homère · Iliade XXIV · rencontre de Priam et Achille</text>
<path d="M65 145H1255" stroke="#8c704e" stroke-width="1.5"/>
<text x="65" y="205" font-size="18" font-family="Arial,sans-serif" letter-spacing="3" fill="#dab77e">LECTURE CHRONOLOGIQUE</text>
<line x1="174" y1="287" x2="1146" y2="287" stroke="#a5875e" stroke-width="4"/>
<circle cx="174" cy="287" r="41" fill="#253238" stroke="#d6ae73" stroke-width="3"/>
<text x="174" y="299" text-anchor="middle" font-size="31" font-family="Georgia,serif" fill="#fff0d3">01</text>
<rect x="24" y="355" width="300" height="219" rx="9" fill="#19272b" stroke="#6e6556" stroke-width="1.5"/>
<text x="174" y="410" font-family="Georgia,serif" font-size="27" text-anchor="middle" fill="#f0d29e">Supplication</text>
<text x="174" y="443" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#dbb884">XXIV, 477–506</text>
<text x="174" y="490" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#f3ece1">Priam invoque Pélée</text>
<text x="174" y="521" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#f3ece1">et réclame le corps.</text>
<circle cx="498" cy="287" r="41" fill="#253238" stroke="#d6ae73" stroke-width="3"/>
<text x="498" y="299" text-anchor="middle" font-size="31" font-family="Georgia,serif" fill="#fff0d3">02</text>
<rect x="348" y="355" width="300" height="219" rx="9" fill="#19272b" stroke="#6e6556" stroke-width="1.5"/>
<text x="498" y="410" font-family="Georgia,serif" font-size="27" text-anchor="middle" fill="#f0d29e">Deuil partagé</text>
<text x="498" y="443" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#dbb884">XXIV, 507–516</text>
<text x="498" y="490" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#f3ece1">Chacun pleure un mort :</text>
<text x="498" y="521" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#f3ece1">Hector, Pélée et Patrocle.</text>
<circle cx="822" cy="287" r="41" fill="#253238" stroke="#d6ae73" stroke-width="3"/>
<text x="822" y="299" text-anchor="middle" font-size="31" font-family="Georgia,serif" fill="#fff0d3">03</text>
<rect x="672" y="355" width="300" height="219" rx="9" fill="#19272b" stroke="#6e6556" stroke-width="1.5"/>
<text x="822" y="410" font-family="Georgia,serif" font-size="27" text-anchor="middle" fill="#f0d29e">Corps rendu</text>
<text x="822" y="443" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#dbb884">XXIV, 580–601</text>
<text x="822" y="490" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#f3ece1">Le corps est préparé</text>
<text x="822" y="521" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#f3ece1">puis remis à Priam.</text>
<circle cx="1146" cy="287" r="41" fill="#253238" stroke="#d6ae73" stroke-width="3"/>
<text x="1146" y="299" text-anchor="middle" font-size="31" font-family="Georgia,serif" fill="#fff0d3">04</text>
<rect x="996" y="355" width="300" height="219" rx="9" fill="#19272b" stroke="#6e6556" stroke-width="1.5"/>
<text x="1146" y="410" font-family="Georgia,serif" font-size="27" text-anchor="middle" fill="#f0d29e">Trêve limitée</text>
<text x="1146" y="443" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#dbb884">XXIV, 656–672</text>
<text x="1146" y="490" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#f3ece1">Des jours sont accordés</text>
<text x="1146" y="521" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#f3ece1">aux funérailles d’Hector.</text>
<text x="660" y="627" text-anchor="middle" font-size="21" font-family="Georgia,serif" fill="#e8d4b1">L’accord n’abolit ni la guerre ni le deuil : il rend possibles les rites funéraires.</text>
<text x="660" y="673" text-anchor="middle" font-size="16" font-family="Arial,sans-serif" fill="#bfb5a4">MYTHOS · interprétation pédagogique 2D assistée par IA · 4 novembre 2026 · aucun artefact représenté</text>
</svg>