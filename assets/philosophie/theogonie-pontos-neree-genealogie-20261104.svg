<title id="pontos-lineage-title">Pontos : généalogie et savoirs de la mer</title>
<desc id="pontos-lineage-desc">Arbre conceptuel de la descendance marine de Pontos : Nérée premier-né, puis Thaumas, Phorcys, Kêtô et Eurybie par union avec Gaïa ; Nérée et Doris ont les Néréides. Hésiode, Théogonie 233–264.</desc>
<metadata>MYTHOS ; création vectorielle originale 2D avec assistance IA ; 2026-11-04 ; source primaire : Hésiode, Théogonie 233–264 ; diagramme interprétatif contemporain, non artefact antique.</metadata>
