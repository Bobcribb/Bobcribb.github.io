 juste</text><text x="174" y="482" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#8bb3ae" font-weight="400" text-anchor="middle">v. 233–236</text><line x1="417" y1="296" x2="417" y2="324" stroke="#c8a96e" stroke-width="2" stroke-linecap="round"/><circle cx="417" cy="324" r="4" fill="#d3b478"/><rect x="303" y="327" width="225" height="173" rx="13" fill="#152637" stroke="#78613d" stroke-width="1.6"/><text x="417" y="363" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#f2e7d1" font-weight="700" text-anchor="middle">THAUMAS</text><text x="417" y="394" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d1b475" font-weight="400" text-anchor="middle">Avec Gaïa</text><text x="417" y="428" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#cddcd8" font-weight="400" text-anchor="middle">Puissance marine</text><text x="417" y="452" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#cddcd8" font-weight="400" text-anchor="middle">nommée dans la lignée</text><text x="417" y="482" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#8bb3ae" font-weight="400" text-anchor="middle">v. 237–239</text><line x1="660" y1="296" x2="660" y2="324" stroke="#c8a96e" stroke-width="2" stroke-linecap="round"/><circle cx="660" cy="324" r="4" fill="#d3b478"/><rect x="546" y="327" width="225" height="173" rx="13" fill="#152637" stroke="#78613d" stroke-width="1.6"/><text x="660" y="363" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#f2e7d1" font-weight="700" text-anchor="middle">PHORCYS</text><text x="660" y="394" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d1b475" font-weight="400" text-anchor="middle">Avec Gaïa</text><text x="660" y="428" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#cddcd8" font-weight="400" text-anchor="middle">Figure marine</text><text x="660" y="452" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#cddcd8" font-weight="400" text-anchor="middle">de la généalogie</text><text x="660" y="482" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#8bb3ae" font-weight="400" text-anchor="middle">v. 237–239</text><line x1="903" y1="296" x2="903" y2="324" stroke="#c8a96e" stroke-width="2" stroke-linecap="round"/><circle cx="903" cy="324" r="4" fill="#d3b478"/><rect x="789" y="327" width="225" height="173" rx="13" fill="#152637" stroke="#78613d" stroke-width="1.6"/><text x="903" y="363" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#f2e7d1" font-weight="700" text-anchor="middle">KÊTÔ</text><text x="903" y="394" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d1b475" font-weight="400" text-anchor="middle">Avec Gaïa</text><text x="903" y="428" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#cddcd8" font-weight="400" text-anchor="middle">Figure marine</text><text x="903" y="452" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#cddcd8" font-weight="400" text-anchor="middle">de la généalogie</text><text x="903" y="482" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#8bb3ae" font-weight="400" text-anchor="middle">v. 237–239</text><line x1="1146" y1="296" x2="1146" y2="324" stroke="#c8a96e" stroke-width="2" stroke-linecap="round"/><circle cx="1146" cy="324" r="4" fill="#d3b478"/><rect x="1032" y="327" width="225" height="173" rx="13" fill="#152637" stroke="#78613d" stroke-width="1.6"/><text x="1146" y="363" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#f2e7d1" font-weight="700" text-anchor="middle">EURYBIE</text><text x="1146" y="394" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d1b475" font-weight="400" text-anchor="middle">Avec Gaïa</text><text x="1146" y="428" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#cddcd8" font-weight="400" text-anchor="middle">Puissance au cœur</text><text x="1146" y="452" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#cddcd8" font-weight="400" text-anchor="middle">d’adamant</text><text x="1146" y="482" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#8bb3ae" font-weight="400" text-anchor="middle">v. 237–239</text><rect x="58" y="530" width="1204" height="96" rx="12" fill="#1b2d36" stroke="#657460" stroke-width="1.6"/><text x="86" y="569" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#d6b776" font-weight="700" text-anchor="start">NÉRÉE + DORIS</text><text x="285" y="569" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#d6b776" font-weight="700" text-anchor="start">→</text><text x="343" y="569" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#f2e8d6" font-weight="700" text-anchor="start">les cinquante Néréides</text><text x="86" y="602" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#cddcd8" font-weight="400" text-anchor="start">Thétis, Amphitrite, Galatée et d’autres : catalogue des filles (v. 240–264).</text><text x="70" y="664" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ece0c9" font-weight="400" text-anchor="start">LECTURE : filiation poétique, non carte biologique ou artefact antique.</text><text x="70" y="690" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#aabbb8" font-weight="400" text-anchor="start">SOURCE : Hésiode, Théogonie 233–264  ·  Schéma original 2D assisté par IA (2026)</text>
