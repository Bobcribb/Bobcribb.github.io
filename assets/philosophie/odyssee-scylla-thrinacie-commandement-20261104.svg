<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" width="1320" height="720" role="img" aria-labelledby="scylla-thrinacie-title scylla-thrinacie-desc">
<title id="scylla-thrinacie-title">Commander dans l’incertitude : Scylla et Thrinacie</title>
<desc id="scylla-thrinacie-desc">Quatre étapes du chant XII de l&apos;Odyssée : mise en garde de Circé, traversée de Scylla et Charybde et perte de six compagnons, mise en garde pour les troupeaux d&apos;Hélios, transgression et naufrage.</desc>
<metadata>MYTHOS ; création vectorielle originale 2D avec assistance IA ; 2026-11-04 ; source primaire : Homère, Odyssée XII, 105–126 et 201–425 ; diagramme interprétatif contemporain, non artefact antique.</metadata>
<rect width="1320" height="720" fill="#0d1621"/>
<rect x="19" y="19" width="1282" height="682" rx="15" fill="none" stroke="#796747" stroke-width="2"/>
<path d="M65 167 H1255" stroke="#c6a86b" stroke-width="2"/>
<text x="70" y="61" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d2b578" font-weight="700" text-anchor="start">MYTHOS  /  ODYSSÉE, CHANT XII</text><text x="70" y="112" font-family="Arial,Helvetica,sans-serif" font-size="37" fill="#f2e9d7" font-weight="700" text-anchor="start">Commander dans l’incertitude : Scylla et Thrinacie</text><text x="70" y="146" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#c7d4d2" font-weight="400" text-anchor="start">Des épreuves distinctes : péril anticipé, secret, interdit, désobéissance.</text><rect x="55" y="207" width="284" height="307" rx="14" fill="#152637" stroke="#78613d" stroke-width="1.6"/><circle cx="92" cy="247" r="21" fill="#d2b574"/><text x="92" y="254" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#132435" font-weight="700" text-anchor="middle">01</text><text x="72" y="298" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#f4e5c7" font-weight="700" text-anchor="start">AVERTISSEMENT</text><text x="72" y="328" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#8bb3ae" font-weight="400" text-anchor="start">XII, 105–126</text><text x="72" y="380" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#dde7df" font-weight="400" text-anchor="start">Circé expose le danger :</text><text x="72" y="410" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#dde7df" font-weight="400" text-anchor="start">Scylla prend des hommes ;</text><text x="72" y="440" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#dde7df" font-weight="400" text-anchor="start">Charybde peut engloutir</text><text x="72" y="470" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#dde7df" font-weight="400" text-anchor="start">tout le navire.</text><line x1="341" y1="361" x2="357" y2="361" stroke="#d2b574" stroke-width="3" stroke-linecap="round"/><rect x="359" y="207" width="284" height="307" rx="14" fill="#152637" stroke="#78613d" stroke-width="1.6"/><circle cx="396" cy="247" r="21" fill="#d2b574"/><text x="396" y="254" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#132435" font-weight="700" text-anchor="middle">02</text><text x="376" y="298" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#f4e5c7" font-weight="700" text-anchor="start">LE DÉTROIT</text><text x="376" y="328" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#8bb3ae" font-weight="400" text-anchor="start">XII, 201–259</text><text x="376" y="380" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#dde7df" font-weight="400" text-anchor="start">Ulysse ne révèle pas</text><text x="376" y="410" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#dde7df" font-weight="400" text-anchor="start">toute la menace.</text><text x="376" y="440" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#dde7df" font-weight="400" text-anchor="start">Scylla emporte six</text><text x="376" y="470" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#dde7df" font-weight="400" text-anchor="start">de ses compagnons.</text><line x1="645" y1="361" x2="661" y2="361" stroke="#d2b574" stroke-width="3" stroke-linecap="round"/><rect x="663" y="207" width="284" height="307" rx="14" fill="#152637" stroke="#78613d" stroke-width="1.6"/><circle cx="700" cy="247" r="21" fill="#d2b574"/><text x="700" y="254" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#132435" font-weight="700" text-anchor="middle">03</text><text x="680" y="298" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#f4e5c7" font-weight="700" text-anchor="start">L’ÎLE DU SOLEIL</text><text x="680" y="328" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#8bb3ae" font-weight="400" text-anchor="start">XII, 260–333</text><text x="680" y="380" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#dde7df" font-weight="400" text-anchor="start">Les troupeaux d’Hélios</text><text x="680" y="410" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#dde7df" font-weight="400" text-anchor="start">doivent être épargnés.</text><text x="680" y="440" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#dde7df" font-weight="400" text-anchor="start">Tempête, faim et fatigue</text><text x="680" y="470" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#dde7df" font-weight="400" text-anchor="start">éprouvent l’équipage.</text><line x1="949" y1="361" x2="965" y2="361" stroke="#d2b574" stroke-width="3" stroke-linecap="round"/><rect x="967" y="207" width="284" height="307" rx="14" fill="#152637" stroke="#78613d" stroke-width="1.6"/><circle cx="1004" cy="247" r="21" fill="#d2b574"/><text x="1004" y="254" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#132435" font-weight="700" text-anchor="middle">04</text><text x="984" y="298" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#f4e5c7" font-weight="700" text-anchor="start">LA TRANSGRESSION</text><text x="984" y="328" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#8bb3ae" font-weight="400" text-anchor="start">XII, 334–425</text><text x="984" y="380" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#dde7df" font-weight="400" text-anchor="start">Des hommes abattent</text><text x="984" y="410" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#dde7df" font-weight="400" text-anchor="start">les animaux sacrés.</text><text x="984" y="440" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#dde7df" font-weight="400" text-anchor="start">Après le départ, Zeus</text><text x="984" y="470" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#dde7df" font-weight="400" text-anchor="start">détruit le navire.</text><rect x="58" y="552" width="1204" height="85" rx="12" fill="#1a2b35" stroke="#51685f" stroke-width="1.6"/><text x="83" y="586" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#d4b776" font-weight="700" text-anchor="start">DISTINCTION ESSENTIELLE</text><text x="83" y="617" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#efe7d5" font-weight="400" text-anchor="start">Le récit sépare la perte subie au détroit et l’interdit religieux transgressé à Thrinacie.</text><text x="70" y="670" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#aabbb8" font-weight="400" text-anchor="start">SOURCE : Homère, Odyssée XII, 105–126 et 201–425  ·  Schéma original 2D assisté par IA (2026)</text>
</svg>
