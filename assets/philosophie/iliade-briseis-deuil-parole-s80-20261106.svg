<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="s80-title s80-desc">
<title id="s80-title">Briséis dans l'Iliade : prix de guerre, voix du deuil, reconnaissance inachevée</title>
<desc id="s80-desc">Schéma critique en trois tableaux, sans personnages figurés : au chant I, Briséis est traitée comme un prix d'honneur disputé entre chefs ; au chant XIX, sa plainte pour Patrocle rappelle la perte de ses proches ; cette parole ne met pas fin à sa captivité.</desc>
<metadata>MYTHOS, 6 novembre 2026, séance 80. Schéma éditorial original en deux dimensions, réalisé avec assistance IA ; création contemporaine, non artefact historique, non illustration antique, non reconstitution archéologique, sans perspective 2,5D. Références : Homère, Iliade I, 318–348 et XIX, 282–302 ; édition grecque Perseus.</metadata>
<rect width="1200" height="650" fill="#0b1217"/>
<rect x="18" y="18" width="1164" height="614" rx="4" fill="none" stroke="#b18d59" stroke-width="2"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="48" y="59" font-size="18" font-weight="700" fill="#d9b578">MYTHOS  /  PHILOLOGIE ET PHILOSOPHIE  /  2026</text>
<text x="48" y="111" font-family="DejaVu Serif, Georgia, serif" font-size="37" fill="#f5e9d2">Briséis : de l'objet de prestige à la voix du deuil</text>
<text x="48" y="151" font-size="20" fill="#bcd0d0">Iliade I et XIX  ·  Deux séquences du poème, une tension éthique</text>
<rect x="48" y="207" width="338" height="284" rx="10" fill="#18272e" stroke="#b18d59" stroke-width="2"/>
<rect x="431" y="207" width="338" height="284" rx="10" fill="#18272e" stroke="#b18d59" stroke-width="2"/>
<rect x="814" y="207" width="338" height="284" rx="10" fill="#18272e" stroke="#b18d59" stroke-width="2"/>
<text x="70" y="254" font-size="24" font-weight="700" fill="#e9c48a">I · LE PRIX</text>
<text x="70" y="297" font-size="23" fill="#f1e5d0">γέρας (géras)</text>
<text x="70" y="340" font-size="18" fill="#e1e8e5">Briséis est prise comme</text>
<text x="70" y="372" font-size="18" fill="#e1e8e5">signe du rang héroïque.</text>
<text x="70" y="419" font-size="17" fill="#c8bbac">Chant I, v. 318–348</text>
<text x="453" y="254" font-size="24" font-weight="700" fill="#e9c48a">II · LA PLAINTE</text>
<text x="453" y="297" font-size="21" fill="#f1e5d0">Parole de Briséis</text>
<text x="453" y="340" font-size="18" fill="#e1e8e5">Elle pleure Patrocle</text>
<text x="453" y="372" font-size="18" fill="#e1e8e5">et ses proches perdus.</text>
<text x="453" y="419" font-size="17" fill="#c8bbac">Chant XIX, v. 282–302</text>
<text x="836" y="254" font-size="23" font-weight="700" fill="#e9c48a">III · LA LIMITE</text>
<text x="836" y="297" font-size="21" fill="#f1e5d0">Reconnaissance</text>
<text x="836" y="340" font-size="18" fill="#e1e8e5">Sa voix est entendue ;</text>
<text x="836" y="372" font-size="18" fill="#e1e8e5">son statut reste captif.</text>
<text x="836" y="419" font-size="17" fill="#c8bbac">Lecture critique, non citation</text>
<path d="M392 351H424M415 344l9 7-9 7M776 351H807M798 344l9 7-9 7" fill="none" stroke="#deb57a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="48" y="538" font-size="18" fill="#ebdfcb">Une voix individuelle ne transforme pas à elle seule les conditions de la domination.</text>
<text x="48" y="578" font-size="17" fill="#d8bd8e">Source : Homère, Iliade I, 318–348 et XIX, 282–302 ; texte grec Perseus.</text>
<text x="48" y="609" font-size="15" fill="#c4d2ce">Schéma éditorial 2D réalisé avec assistance IA · non artefact antique · non reconstitution</text>
</g>
</svg>
