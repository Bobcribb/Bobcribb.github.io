<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1320 710" width="1320" height="710">
<title id="title">Le lit enraciné : signe de reconnaissance d’Ulysse</title>
<desc id="description">Coupe schématique non archéologique du lit construit autour du tronc d’un olivier vivant, avec une chambre, un sol et des racines. À droite, trois temps du récit d’Homère : l’épreuve de Pénélope, la description par Ulysse et la reconnaissance, Odyssée XXIII 177 à 230.</desc>
<rect width="1320" height="710" fill="#10191c"/>
<rect x="16" y="16" width="1288" height="678" rx="9" fill="none" stroke="#95734b" stroke-width="2"/>
<text x="57" y="72" font-size="41" font-family="Georgia,serif" fill="#f1dbb3">Le lit enraciné : un signe que deux êtres connaissent</text>
<text x="58" y="111" font-size="22" font-family="Arial,sans-serif" fill="#d5c7ae">Homère · Odyssée XXIII, 177–230 · épreuve de reconnaissance</text>
<line x1="58" y1="133" x2="1260" y2="133" stroke="#93744b" stroke-width="2"/>
<rect x="56" y="151" width="744" height="456" rx="8" fill="#1a282c" stroke="#736b56"/>
<text x="82" y="191" font-family="Arial,sans-serif" font-size="18" fill="#ddbb85" letter-spacing="2">SCHÉMA CONCEPTUEL DU LIT · NON ARCHÉOLOGIQUE</text>
