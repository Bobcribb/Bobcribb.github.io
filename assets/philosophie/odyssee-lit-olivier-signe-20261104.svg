<path d="M349 398V353" stroke="#f3d99a" stroke-width="5"/>
<line x1="464" y1="350" x2="693" y2="323" stroke="#cfb57e" stroke-width="2"/>
<text x="681" y="310" text-anchor="end" font-family="Arial,sans-serif" font-size="20" fill="#f6e1b7">couche construite</text>
<text x="680" y="339" text-anchor="end" font-family="Arial,sans-serif" font-size="20" fill="#f6e1b7">autour du tronc</text>
<path d="M351 501L232 473" stroke="#92b197" stroke-width="2"/>
<text x="118" y="464" font-family="Arial,sans-serif" font-size="19" fill="#cce1bd">olivier vivant</text>
<text x="118" y="488" font-family="Arial,sans-serif" font-size="16" fill="#cce1bd">racines non déplacées</text>
<!-- Reading boxes -->
<rect x="837" y="152" width="427" height="128" rx="8" fill="#1b292f" stroke="#8b724c"/>
<text x="861" y="184" font-family="Arial,sans-serif" font-size="18" fill="#d8b77c">XXIII, 177–180 · PÉNÉLOPE</text>
<text x="861" y="219" font-family="Georgia,serif" font-size="23" fill="#f3e2c6">Elle évoque un lit à déplacer.</text>
<text x="861" y="249" font-family="Arial,sans-serif" font-size="18" fill="#e1d7ca">L’ordre fonctionne comme épreuve.</text>
<path d="M1050 281V308" stroke="#c5a16d" stroke-width="2"/>
<path d="M1042 301L1050 312L1058 301" fill="none" stroke="#c5a16d" stroke-width="2"/>
<rect x="837" y="318" width="427" height="128" rx="8" fill="#1b292f" stroke="#8b724c"/>
<text x="861" y="350" font-family="Arial,sans-serif" font-size="18" fill="#d8b77c">XXIII, 183–204 · ULYSSE</text>
<text x="861" y="386" font-family="Georgia,serif" font-size="23" fill="#f3e2c6">Il décrit le secret du tronc.</text>
<text x="861" y="415" font-family="Arial,sans-serif" font-size="18" fill="#e1d7ca">Ce lit ne se déplace pas intact.</text>
<path d="M1050 447V473" stroke="#c5a16d" stroke-width="2"/>
<path d="M1042 465L1050 476L1058 465" fill="none" stroke="#c5a16d" stroke-width="2"/>
<rect x="837" y="480" width="427" height="128" rx="8" fill="#1b292f" stroke="#8b724c"/>
<text x="861" y="512" font-family="Arial,sans-serif" font-size="18" fill="#d8b77c">XXIII, 205–230 · RECONNAISSANCE</text>
<text x="861" y="547" font-family="Georgia,serif" font-size="23" fill="#f3e2c6">Pénélope reconnaît ce signe.</text>
<text x="861" y="576" font-family="Arial,sans-serif" font-size="18" fill="#e1d7ca">Le savoir partagé atteste le lien.</text>
<text x="660" y="647" font-family="Georgia,serif" text-anchor="middle" font-size="21" fill="#e7d4af">Le dessin n’est ni un plan de palais ni une restitution de mobilier mycénien.</text>
<text x="660" y="677" font-family="Arial,sans-serif" text-anchor="middle" font-size="16" fill="#bfb4a5">MYTHOS · schéma narratif 2D assisté par IA · 4 novembre 2026 · aucun artefact représenté</text>
</svg>