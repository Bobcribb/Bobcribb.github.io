<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="nausicaa-t nausicaa-d"><title id="nausicaa-t">Nausicaa et la juste distance</title><desc id="nausicaa-d">L&apos;hospitalité associe demande, secours et règles sociales. Aucun objet antique représenté.</desc><metadata>Illustration MYTHOS originale, réalisée avec assistance IA le 4 novembre 2026, non historique.</metadata><rect width="1200" height="650" fill="#0e171e"/><rect x="16" y="16" width="1168" height="620" fill="none" stroke="#987e51" stroke-width="2"/><text x="54" y="55" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#d5b476">MYTHOS / DOCUMENT PÉDAGOGIQUE</text><text x="54" y="112" font-family="Arial,DejaVu Sans,sans-serif" font-size="35" font-weight="700" fill="#f8ecd6">Nausicaa et la juste distance</text><text x="54" y="157" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#bbd3d1">Odyssée VI, 127–315</text><rect x="45" y="204" width="378" height="265" rx="16" fill="#192b36" stroke="#806a48" stroke-width="2"/><text x="68" y="245" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#d5b476">01</text><text x="68" y="290" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#eee0c5">PAROLE</text><text x="68" y="358" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#f0e8d6">Ulysse supplie sans</text><text x="68" y="391" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#f0e8d6">toucher Nausicaa.</text><rect x="436" y="204" width="378" height="265" rx="16" fill="#192b36" stroke="#806a48" stroke-width="2"/><text x="459" y="245" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#d5b476">02</text><text x="459" y="290" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#eee0c5">SECOURS</text><text x="459" y="358" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#f0e8d6">Elle lui procure</text><text x="459" y="391" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#f0e8d6">vêtements et repas.</text><rect x="827" y="204" width="378" height="265" rx="16" fill="#192b36" stroke="#806a48" stroke-width="2"/><text x="850" y="245" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#d5b476">03</text><text x="850" y="290" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#eee0c5">ENTRÉE</text><text x="850" y="358" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#f0e8d6">Elle conseille l&apos;accès</text><text x="850" y="391" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#f0e8d6">à la cité et à Arété.</text><text x="55" y="522" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#eee2cc">L&apos;hospitalité associe demande, secours et règles sociales.</text><text x="55" y="590" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#b8cfcc">Source : Odyssée VI, 127–315</text><text x="55" y="631" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#b4bcb3">MYTHOS · 4 novembre 2026 · schéma original 2D assisté par IA · non archéologique</text></svg>
