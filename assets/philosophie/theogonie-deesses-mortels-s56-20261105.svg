<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="title desc"><title id="title">Déesses et mortels : une fin ouverte</title><desc id="desc">Filiations héroïques dans la fin transmise de la Théogonie. Trois étapes explicitées dans la légende de l'étude.</desc><metadata>MYTHOS 5 novembre 2026. Schéma original 2D réalisé avec assistance IA ; création contemporaine, non historique, ne reproduisant aucun artefact antique. Hésiode, Théogonie, v. 1003–1018 (passage discuté)</metadata><rect width="1200" height="650" fill="#0e171e"/><rect x="17" y="17" width="1166" height="616" fill="none" stroke="#987e51" stroke-width="2"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="55" y="68" fill="#d5b476" font-size="18" font-weight="bold">MYTHOS · DOCUMENT CRITIQUE · 2026</text><text x="55" y="122" fill="#f8ecd6" font-size="32" font-weight="bold">Déesses et mortels : une fin ouverte</text><text x="55" y="166" fill="#bfd2d0" font-size="21">Filiations héroïques dans la fin transmise de la Théogonie</text><rect x="55" y="231" width="335" height="244" rx="16" fill="#192b35" stroke="#ad905e" stroke-width="2"/><text x="73" y="269" fill="#dfb978" font-size="24" font-weight="bold">01</text><text x="73" y="318" fill="#f9ebd3" font-size="20" font-weight="bold">THÉTIS + PÉLÉE</text><text x="73" y="381" fill="#e6eddf" font-size="21">Achille</text><text x="73" y="418" fill="#e6eddf" font-size="21">(v. 1006–1007).</text><rect x="437" y="231" width="335" height="244" rx="16" fill="#192b35" stroke="#ad905e" stroke-width="2"/><text x="455" y="269" fill="#dfb978" font-size="24" font-weight="bold">02</text><text x="455" y="318" fill="#f9ebd3" font-size="20" font-weight="bold">APHRODITE + ANCHISE</text><text x="455" y="381" fill="#e6eddf" font-size="21">Énée</text><text x="455" y="418" fill="#e6eddf" font-size="21">(v. 1008–1010).</text><rect x="819" y="231" width="335" height="244" rx="16" fill="#192b35" stroke="#ad905e" stroke-width="2"/><text x="837" y="269" fill="#dfb978" font-size="24" font-weight="bold">03</text><text x="837" y="318" fill="#f9ebd3" font-size="20" font-weight="bold">CIRCÉ + ULYSSE</text><text x="837" y="381" fill="#e6eddf" font-size="21">Filiation nommée</text><text x="837" y="418" fill="#e6eddf" font-size="21">(v. 1011–1016).</text><text x="55" y="531" fill="#e1ddca" font-size="18">Le statut textuel de certains vers finaux est discuté ; ne pas les harmoniser.</text><text x="55" y="580" fill="#d5b476" font-size="17">Hésiode, Théogonie, v. 1003–1018 (passage discuté)</text><text x="55" y="616" fill="#bdc9c6" font-size="16">Schéma vectoriel assisté par IA · non historique · non archéologique</text></g></svg>
