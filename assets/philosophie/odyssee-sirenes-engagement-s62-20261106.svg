<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="title desc"><title id="title">Sirènes : écouter sans céder</title><desc id="desc">Odyssée XII · connaissance et contrainte volontaire Trois étapes d'analyse. La décision anticipée protège le groupe du désir présent.</desc><metadata>MYTHOS, 6 novembre 2026, séance 62. Diagramme 2D interprétatif original préparé avec assistance IA. Création contemporaine non historique, aucun artefact. Source primaire : Homère, Odyssée XII, v. 39–54 et 153–200</metadata><rect width="1200" height="650" fill="#0e171e"/><rect x="17" y="17" width="1166" height="616" fill="none" stroke="#987e51" stroke-width="2"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="55" y="68" fill="#d5b476" font-size="18" font-weight="bold">MYTHOS · LECTURE SCIENTIFIQUE · 2026</text><text x="55" y="122" fill="#f8ecd6" font-size="32" font-weight="bold">Sirènes : écouter sans céder</text><text x="55" y="166" fill="#bfd2d0" font-size="21">Odyssée XII · connaissance et contrainte volontaire</text><rect x="55" y="235" width="335" height="245" rx="12" fill="#192832" stroke="#b39763" stroke-width="2"/><text x="73" y="275" fill="#deb979" font-size="24" font-weight="bold">01</text><text x="73" y="323" fill="#fff3dd" font-size="21" font-weight="bold">AVERTISSEMENT</text><text x="73" y="376" fill="#e5ebdf" font-size="20">Circé signale le</text><text x="73" y="410" fill="#e5ebdf" font-size="20">danger du chant.</text><rect x="437" y="235" width="335" height="245" rx="12" fill="#192832" stroke="#b39763" stroke-width="2"/><text x="455" y="275" fill="#deb979" font-size="24" font-weight="bold">02</text><text x="455" y="323" fill="#fff3dd" font-size="21" font-weight="bold">RÈGLE PRÉALABLE</text><text x="455" y="376" fill="#e5ebdf" font-size="20">Cire pour les rameurs ;</text><text x="455" y="410" fill="#e5ebdf" font-size="20">Ulysse lié au mât.</text><rect x="819" y="235" width="335" height="245" rx="12" fill="#192832" stroke="#b39763" stroke-width="2"/><text x="837" y="275" fill="#deb979" font-size="24" font-weight="bold">03</text><text x="837" y="323" fill="#fff3dd" font-size="21" font-weight="bold">TENIR LA RÈGLE</text><text x="837" y="376" fill="#e5ebdf" font-size="20">Les rameurs resserrent</text><text x="837" y="410" fill="#e5ebdf" font-size="20">les liens du héros.</text><text x="55" y="536" fill="#e1ddca" font-size="19">La décision anticipée protège le groupe du désir présent.</text><text x="55" y="580" fill="#d5b476" font-size="18">Homère, Odyssée XII, v. 39–54 et 153–200</text><text x="55" y="617" fill="#bdc9c6" font-size="16">Schéma 2D assisté par IA · interprétation actuelle · non historique</text></g></svg>
