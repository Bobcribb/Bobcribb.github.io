<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="title desc"><title id="title">Chrysès : d’une offense à la crise commune</title><desc id="desc">Quatre étapes de la crise : la supplication de Chrysès, le refus d'Agamemnon, la peste d'Apollon et l'assemblée convoquée par Achille.</desc><metadata>MYTHOS, 6 novembre 2026, séance 70. Schéma éditorial en 2D créé avec assistance IA. Création contemporaine, non historique, aucun artefact représenté. Homère, Iliade I, v. 12–120.</metadata><rect width="1200" height="660" fill="#0e171e"/><rect x="18" y="18" width="1164" height="624" fill="none" stroke="#a28a5a" stroke-width="2"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="45" y="62" fill="#d5b476" font-size="19" font-weight="700">MYTHOS · LECTURE PHILOLOGIQUE · 2026</text><text x="45" y="118" fill="#fff0d7" font-size="34" font-weight="700">Chrysès : d’une offense à la crise commune</text><text x="45" y="166" fill="#c6d9d7" font-size="21">Iliade I · prière, violence, maladie et parole publique</text><rect x="40" y="235" width="265" height="260" rx="12" fill="#1a2b34" stroke="#ad905f" stroke-width="2"/><text x="58" y="279" fill="#e6be77" font-size="27" font-weight="700">01</text><text x="58" y="329" fill="#fff2d7" font-size="17" font-weight="700">SUPPLICATION</text><text x="58" y="390" fill="#e6ebdf" font-size="17">Chrysès demande</text><text x="58" y="427" fill="#e6ebdf" font-size="17">le retour de sa fille.</text><rect x="325" y="235" width="265" height="260" rx="12" fill="#1a2b34" stroke="#ad905f" stroke-width="2"/><text x="343" y="279" fill="#e6be77" font-size="27" font-weight="700">02</text><text x="343" y="329" fill="#fff2d7" font-size="17" font-weight="700">REFUS DU CHEF</text><text x="343" y="390" fill="#e6ebdf" font-size="17">Agamemnon rejette</text><text x="343" y="427" fill="#e6ebdf" font-size="17">la demande du père.</text><rect x="610" y="235" width="265" height="260" rx="12" fill="#1a2b34" stroke="#ad905f" stroke-width="2"/><text x="628" y="279" fill="#e6be77" font-size="27" font-weight="700">03</text><text x="628" y="329" fill="#fff2d7" font-size="17" font-weight="700">MORTS DANS LE CAMP</text><text x="628" y="390" fill="#e6ebdf" font-size="17">Apollon frappe</text><text x="628" y="427" fill="#e6ebdf" font-size="17">l’armée achéenne.</text><rect x="895" y="235" width="265" height="260" rx="12" fill="#1a2b34" stroke="#ad905f" stroke-width="2"/><text x="913" y="279" fill="#e6be77" font-size="27" font-weight="700">04</text><text x="913" y="329" fill="#fff2d7" font-size="17" font-weight="700">DÉLIBÉRATION</text><text x="913" y="390" fill="#e6ebdf" font-size="17">Achille convoque</text><text x="913" y="427" fill="#e6ebdf" font-size="17">l’assemblée.</text><text x="46" y="541" fill="#e8dfcd" font-size="20">La peste cause des morts réels : elle ne se réduit pas à une allégorie politique.</text><text x="46" y="587" fill="#e1c083" font-size="18">Homère, Iliade I, v. 12–120</text><text x="46" y="624" fill="#b9c5c3" font-size="17">Schéma 2D avec assistance IA · interprétation, pas un artefact historique</text></g></svg>
