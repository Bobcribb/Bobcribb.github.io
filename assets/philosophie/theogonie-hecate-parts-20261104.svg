<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" width="1320" height="710" viewBox="0 0 1320 710">
<title id="title">Hécate : les parts préservées sous le règne de Zeus</title>
<desc id="description">Diagramme analytique non archéologique de la Théogonie d’Hésiode, vers 411 à 452. Hécate conserve ses parts dans la terre, la mer et le ciel ; Zeus confirme ses honneurs. Le texte décrit également son aide dans plusieurs activités humaines. Il ne s’agit pas d’une représentation antique ou d’une déesse à trois visages.</desc>
