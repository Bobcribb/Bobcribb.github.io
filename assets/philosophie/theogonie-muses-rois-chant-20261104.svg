<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc" width="1320" height="680" viewBox="0 0 1320 680"><title id="svg-title">Les Muses : justice et chant</title><desc id="svg-desc">Hésiode, Théogonie 79–103 · dons de la parole Calliope: La Muse accompagne, les rois révérés ;, douceur et efficacité, de la parole (80–84).. Le roi juste: Dikai : jugements droits ;, résolution des querelles ;, persuasion en assemblée ;, ordre politique (85–93).. Le chanteur: Les Muses inspirent le chant ;, mémoire des dieux, et des hommes d’autrefois ;, soulagement du deuil. La parole poétique et la parole judiciaire ont des fonctions distinctes.</desc><rect width="1320" height="680" fill="#0d161d"/><rect x="19" y="19" width="1282" height="642" rx="10" fill="none" stroke="#836947" stroke-width="2"/><text x="660" y="78" text-anchor="middle" font-family="Georgia,serif" font-size="40" fill="#f4d8aa">Les Muses : justice et chant</text><text x="660" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#d0c5b3">Hésiode, Théogonie 79–103 · dons de la parole</text><rect x="46" y="164" width="388" height="374" rx="10" fill="#1c282e" stroke="#b38b54" stroke-width="2"/><text x="70" y="204" font-family="Arial,sans-serif" font-size="16" letter-spacing="3" fill="#d0b17d">ÉTAPE 1</text><text x="70" y="265" font-family="Georgia,serif" font-size="30" fill="#f3d5a0">Calliope</text><path d="M70 284h340" stroke="#776548" stroke-width="2"/><text x="70" y="334" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">La Muse accompagne</text><text x="70" y="377" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">les rois révérés ;</text><text x="70" y="420" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">douceur et efficacité</text><text x="70" y="463" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">de la parole (80–84).</text><rect x="466" y="164" width="388" height="374" rx="10" fill="#1c282e" stroke="#b38b54" stroke-width="2"/><text x="490" y="204" font-family="Arial,sans-serif" font-size="16" letter-spacing="3" fill="#d0b17d">ÉTAPE 2</text><text x="490" y="265" font-family="Georgia,serif" font-size="30" fill="#f3d5a0">Le roi juste</text><path d="M490 284h340" stroke="#776548" stroke-width="2"/><text x="490" y="334" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">Dikai : jugements droits ;</text><text x="490" y="377" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">résolution des querelles ;</text><text x="490" y="420" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">persuasion en assemblée ;</text><text x="490" y="463" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">ordre politique (85–93).</text><rect x="886" y="164" width="388" height="374" rx="10" fill="#1c282e" stroke="#b38b54" stroke-width="2"/><text x="910" y="204" font-family="Arial,sans-serif" font-size="16" letter-spacing="3" fill="#d0b17d">ÉTAPE 3</text><text x="910" y="265" font-family="Georgia,serif" font-size="30" fill="#f3d5a0">Le chanteur</text><path d="M910 284h340" stroke="#776548" stroke-width="2"/><text x="910" y="334" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">Les Muses inspirent le chant ;</text><text x="910" y="377" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">mémoire des dieux</text><text x="910" y="420" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">et des hommes d’autrefois ;</text><text x="910" y="463" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">soulagement du deuil.</text><text x="660" y="589" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#e7d3b2">La parole poétique et la parole judiciaire ont des fonctions distinctes.</text><text x="660" y="635" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#b9ac97">MYTHOS · schéma interprétatif 2D · 4 novembre 2026 · sans reproduction d’artefact</text></svg>