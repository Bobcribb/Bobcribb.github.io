<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" width="1320" height="720" role="img" aria-labelledby="glaucos-diomede-title glaucos-diomede-desc">
<title id="glaucos-diomede-title">Glaucos et Diomède : la mémoire de l’hospitalité</title>
<desc id="glaucos-diomede-desc">Diagramme de trois étapes : rencontre armée, reconnaissance d&apos;une hospitalité ancestrale entre Diomède et Glaucos, pacte et échange inégal d&apos;armures. Homère, Iliade VI, 119–236.</desc>
<metadata>MYTHOS ; création vectorielle originale 2D avec assistance IA ; 2026-11-04 ; source primaire : Homère, Iliade VI, 119–236 ; diagramme interprétatif contemporain, non artefact antique.</metadata>
<rect width="1320" height="720" fill="#0d1621"/>
<rect x="19" y="19" width="1282" height="682" rx="15" fill="none" stroke="#796747" stroke-width="2"/>
<path d="M65 167 H1255" stroke="#c6a86b" stroke-width="2"/>
<text x="70" y="61" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d2b578" font-weight="700" text-anchor="start">MYTHOS  /  ILIADE, CHANT VI</text><text x="70" y="112" font-family="Arial,Helvetica,sans-serif" font-size="38" fill="#f2e9d7" font-weight="700" text-anchor="start">Glaucos et Diomède : la mémoire d’une hospitalité</text><text x="70" y="146" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#c7d4d2" font-weight="400" text-anchor="start">Une reconnaissance entre adversaires n’abolit pas la guerre.</text><rect x="62" y="191" width="574" height="200" rx="18" fill="#152438" stroke="#67573c" stroke-width="1.6"/><rect x="684" y="191" width="574" height="200" rx="18" fill="#152438" stroke="#67573c" stroke-width="1.6"/><text x="94" y="231" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d1af71" font-weight="700" text-anchor="start">CAMP ACHÉEN</text><text x="94" y="282" font-family="Arial,Helvetica,sans-serif" font-size="32" fill="#f5ebd6" font-weight="700" text-anchor="start">DIOMÈDE</text><text x="94" y="316" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#cfd8d5" font-weight="400" text-anchor="start">Reçoit le récit de l’ascendance de Glaucos.</text><text x="94" y="346" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#cfd8d5" font-weight="400" text-anchor="start">Se souvient de l’accueil de Bellérophon</text><text x="94" y="372" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#cfd8d5" font-weight="400" text-anchor="start">par son aïeul Oinée.</text><text x="716" y="231" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d1af71" font-weight="700" text-anchor="start">ALLIÉ TROYEN</text><text x="716" y="282" font-family="Arial,Helvetica,sans-serif" font-size="32" fill="#f5ebd6" font-weight="700" text-anchor="start">GLAUCOS</text><text x="716" y="316" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#cfd8d5" font-weight="400" text-anchor="start">Raconte la lignée de Bellérophon.</text><text x="716" y="346" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#cfd8d5" font-weight="400" text-anchor="start">Découvre une alliance d’hospitalité</text><text x="716" y="372" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#cfd8d5" font-weight="400" text-anchor="start">qui précède le conflit présent.</text><line x1="120" y1="424" x2="1200" y2="424" stroke="#cbaa6d" stroke-width="3" stroke-linecap="round"/><rect x="62" y="448" width="371" height="158" rx="12" fill="#172838" stroke="#7a6745" stroke-width="1.6"/><text x="84" y="480" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#d7b676" font-weight="700" text-anchor="start">01</text><text x="134" y="480" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d9b87e" font-weight="700" text-anchor="start">RENCONTRE</text><text x="84" y="516" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#efe7d5" font-weight="400" text-anchor="start">Deux combattants se</text><text x="84" y="542" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#efe7d5" font-weight="400" text-anchor="start">préparent à l’affrontement.</text><text x="84" y="580" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#9cb8b4" font-weight="400" text-anchor="start">VI, 119–142</text><rect x="474" y="448" width="371" height="158" rx="12" fill="#172838" stroke="#7a6745" stroke-width="1.6"/><text x="496" y="480" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#d7b676" font-weight="700" text-anchor="start">02</text><text x="546" y="480" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d9b87e" font-weight="700" text-anchor="start">RECONNAISSANCE</text><text x="496" y="516" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#efe7d5" font-weight="400" text-anchor="start">Une xenia transmise</text><text x="496" y="542" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#efe7d5" font-weight="400" text-anchor="start">par leurs familles.</text><text x="496" y="580" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#9cb8b4" font-weight="400" text-anchor="start">VI, 212–231</text><rect x="886" y="448" width="371" height="158" rx="12" fill="#172838" stroke="#7a6745" stroke-width="1.6"/><text x="908" y="480" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#d7b676" font-weight="700" text-anchor="start">03</text><text x="958" y="480" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d9b87e" font-weight="700" text-anchor="start">PACTE ET ARMES</text><text x="908" y="516" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#efe7d5" font-weight="400" text-anchor="start">Poignées de main ; or contre</text><text x="908" y="542" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#efe7d5" font-weight="400" text-anchor="start">bronze, échange inégal.</text><text x="908" y="580" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#9cb8b4" font-weight="400" text-anchor="start">VI, 232–236</text><text x="70" y="651" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#efe0c3" font-weight="400" text-anchor="start">LECTURE : l’échange est un acte d’amitié, mais la valeur des armes n’est pas égale.</text><text x="70" y="680" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#aabbb8" font-weight="400" text-anchor="start">SOURCE : Homère, Iliade VI, 119–236  ·  Schéma original 2D assisté par IA (2026)  ·  non archéologique</text>
</svg>
