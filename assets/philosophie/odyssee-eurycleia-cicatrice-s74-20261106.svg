<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">La cicatrice : reconnaître et taire</title><desc id="desc">Le narrateur suspend le présent du lavage des pieds pour raconter la blessure ancienne au Parnasse. Euryclée reconnaît Ulysse ; celui-ci lui impose le silence, tandis que Pénélope n'a pas encore accès à cette certitude.</desc><metadata>MYTHOS ; 6 novembre 2026 ; séance 74 ; schéma original 2D élaboré avec assistance IA ; interprétation contemporaine, non artefact ancien ; Homère, Odyssée XIX, 386–507</metadata><rect width="1200" height="690" fill="#0b151d"/><rect x="18" y="18" width="1164" height="654" fill="none" stroke="#b69661" stroke-width="2"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="50" y="56" font-size="18" letter-spacing="3" font-weight="700" fill="#e6c382">MYTHOS   /   DOSSIER PHILOLOGIQUE   /   06.11.2026</text><text x="50" y="110" font-size="33" font-weight="700" fill="#f8edda">La cicatrice : reconnaître et taire</text><text x="50" y="156" font-size="21" fill="#b6cbd1" font-weight="400">Une même marque corporelle relie deux temps du récit</text><text x="55" y="211" font-size="20" fill="#e6c382" font-weight="700">TEMPS DU RÉCIT · ITHAQUE</text><rect x="54" y="233" width="249" height="108" rx="10" fill="#1a2933" stroke="#e6c382" stroke-width="2"/><text x="70" y="275" font-size="18" fill="#f8edda" font-weight="700">Lavage des pieds</text><text x="70" y="308" font-size="18" fill="#f8edda" font-weight="400">par Euryclée</text><rect x="356" y="233" width="249" height="108" rx="10" fill="#1a2933" stroke="#e6c382" stroke-width="2"/><text x="372" y="275" font-size="18" fill="#f8edda" font-weight="700">La cicatrice</text><text x="372" y="308" font-size="18" fill="#f8edda" font-weight="400">est touchée</text><rect x="658" y="233" width="249" height="108" rx="10" fill="#1a2933" stroke="#e6c382" stroke-width="2"/><text x="674" y="275" font-size="18" fill="#f8edda" font-weight="700">Reconnaissance</text><text x="674" y="308" font-size="18" fill="#f8edda" font-weight="400">par la nourrice</text><rect x="960" y="233" width="188" height="108" rx="10" fill="#1a2933" stroke="#e6c382" stroke-width="2"/><text x="976" y="275" font-size="18" fill="#f8edda" font-weight="700">Silence exigé</text><text x="976" y="308" font-size="18" fill="#f8edda" font-weight="400">par Ulysse</text><path d="M307 287 L352 287" fill="none" stroke="#e6c382" stroke-width="4" stroke-linecap="round"/><path d="M341 279 L352 287 L341 295" fill="none" stroke="#e6c382" stroke-width="3" stroke-linecap="round"/><path d="M609 287 L654 287" fill="none" stroke="#e6c382" stroke-width="4" stroke-linecap="round"/><path d="M643 279 L654 287 L643 295" fill="none" stroke="#e6c382" stroke-width="3" stroke-linecap="round"/><path d="M911 287 L956 287" fill="none" stroke="#e6c382" stroke-width="4" stroke-linecap="round"/><path d="M945 279 L956 287 L945 295" fill="none" stroke="#e6c382" stroke-width="3" stroke-linecap="round"/><text x="55" y="398" font-size="20" fill="#a5cfbd" font-weight="700">RETOUR EN ARRIÈRE · PARNASSE</text><rect x="54" y="418" width="375" height="110" rx="10" fill="#1a2933" stroke="#a5cfbd" stroke-width="2"/><text x="75" y="459" font-size="21" fill="#a5cfbd" font-weight="700">Jeune Ulysse</text><text x="75" y="493" font-size="20" fill="#f8edda" font-weight="400">Chasse au sanglier</text><path d="M437 471 L481 471" fill="none" stroke="#a5cfbd" stroke-width="4" stroke-linecap="round"/><path d="M470 463 L481 471 L470 479" fill="none" stroke="#a5cfbd" stroke-width="3" stroke-linecap="round"/><rect x="487" y="418" width="381" height="110" rx="10" fill="#1a2933" stroke="#a5cfbd" stroke-width="2"/><text x="509" y="459" font-size="21" fill="#a5cfbd" font-weight="700">Blessure à la jambe</text><text x="509" y="493" font-size="20" fill="#f8edda" font-weight="400">Une trace demeure</text><path d="M675 415 C675 370 475 372 475 342" fill="none" stroke="#a5cfbd" stroke-width="3" stroke-dasharray="9 7"/><path d="M466 356 L475 342 L484 356" fill="none" stroke="#a5cfbd" stroke-width="3"/><text x="54" y="576" font-size="19" fill="#b6cbd1" font-weight="400">Pénélope n’assiste pas à cette reconnaissance : savoir ≠ pouvoir révéler.</text><text x="50" y="627" font-size="17" fill="#e6c382" font-weight="400">Homère, Odyssée XIX, v. 386–507.</text><text x="50" y="656" font-size="16" fill="#b6cbd1" font-weight="400">Schéma interprétatif 2D avec assistance IA · aucune image d’artefact antique</text></g></svg>
