<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc" width="1320" height="680" viewBox="0 0 1320 680"><title id="svg-title">L’ambassade à Achille : trois appels</title><desc id="svg-desc">Homère, Iliade IX, 225–655 · discours des envoyés Ulysse: Réparation matérielle :, offres d’Agamemnon ;, péril des vaisseaux ;, retour demandé au combat.. Phénix: Lien éducatif et affectif ;, prières personnifiées ;, exemple de Méléagre ;, appel à la conciliation.. Ajax: Devoir envers les proches ;, coutumes de compensation ;, critique de la colère ;, appel à la solidarité. Achille refuse : les dons ne suffisent pas à restaurer l’honneur blessé.</desc><rect width="1320" height="680" fill="#0d161d"/><rect x="19" y="19" width="1282" height="642" rx="10" fill="none" stroke="#836947" stroke-width="2"/><text x="660" y="78" text-anchor="middle" font-family="Georgia,serif" font-size="40" fill="#f4d8aa">L’ambassade à Achille : trois appels</text><text x="660" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#d0c5b3">Homère, Iliade IX, 225–655 · discours des envoyés</text><rect x="46" y="164" width="388" height="374" rx="10" fill="#1c282e" stroke="#b38b54" stroke-width="2"/><text x="70" y="204" font-family="Arial,sans-serif" font-size="16" letter-spacing="3" fill="#d0b17d">ÉTAPE 1</text><text x="70" y="265" font-family="Georgia,serif" font-size="30" fill="#f3d5a0">Ulysse</text><path d="M70 284h340" stroke="#776548" stroke-width="2"/><text x="70" y="334" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">Réparation matérielle :</text><text x="70" y="377" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">offres d’Agamemnon ;</text><text x="70" y="420" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">péril des vaisseaux ;</text><text x="70" y="463" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">retour demandé au combat.</text><rect x="466" y="164" width="388" height="374" rx="10" fill="#1c282e" stroke="#b38b54" stroke-width="2"/><text x="490" y="204" font-family="Arial,sans-serif" font-size="16" letter-spacing="3" fill="#d0b17d">ÉTAPE 2</text><text x="490" y="265" font-family="Georgia,serif" font-size="30" fill="#f3d5a0">Phénix</text><path d="M490 284h340" stroke="#776548" stroke-width="2"/><text x="490" y="334" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">Lien éducatif et affectif ;</text><text x="490" y="377" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">prières personnifiées ;</text><text x="490" y="420" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">exemple de Méléagre ;</text><text x="490" y="463" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">appel à la conciliation.</text><rect x="886" y="164" width="388" height="374" rx="10" fill="#1c282e" stroke="#b38b54" stroke-width="2"/><text x="910" y="204" font-family="Arial,sans-serif" font-size="16" letter-spacing="3" fill="#d0b17d">ÉTAPE 3</text><text x="910" y="265" font-family="Georgia,serif" font-size="30" fill="#f3d5a0">Ajax</text><path d="M910 284h340" stroke="#776548" stroke-width="2"/><text x="910" y="334" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">Devoir envers les proches ;</text><text x="910" y="377" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">coutumes de compensation ;</text><text x="910" y="420" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">critique de la colère ;</text><text x="910" y="463" font-family="Arial, sans-serif" font-size="23" fill="#efe5d6">appel à la solidarité.</text><text x="660" y="589" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#e7d3b2">Achille refuse : les dons ne suffisent pas à restaurer l’honneur blessé.</text><text x="660" y="635" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#b9ac97">MYTHOS · schéma interprétatif 2D · 4 novembre 2026 · sans reproduction d’artefact</text></svg>