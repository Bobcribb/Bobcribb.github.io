name: Sauvegarde complémentaire de trois images MYTHOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-three-media.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sauvegarder trois fichiers originaux de WordPress
        run: python scripts/backup_three_media.py
      - name: Stocker l'archive temporaire
        uses: actions/upload-artifact@v4
        with:
          name: mythos-3-images-complementaires
          path: MYTHOS_3_images_complementaires.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
