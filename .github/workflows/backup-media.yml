name: Sauvegarder les médias WordPress de MYTHOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-media.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Copier et vérifier les médias WordPress
        run: python scripts/backup_media.py
      - name: Préparer une archive temporaire
        uses: actions/upload-artifact@v4
        with:
          name: mythos-medias
          path: archive/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
