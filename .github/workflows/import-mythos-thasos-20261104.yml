name: MYTHOS — Importer Agora de Thasos (WebP photoréaliste)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-mythos-thasos-20261104.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mythos-thasos-binary-import
  cancel-in-progress: false
jobs:
  import_thasos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le vérificateur d'image
        run: python -m pip install --disable-pip-version-check 'Pillow==12.3.0'
      - name: Télécharger le fichier source et contrôler ses octets sans transformation
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from io import BytesIO
          from PIL import Image
          import hashlib
          path=Path('assets/reconstitutions-3d/thasos-agora-hellenistique-romaine-panorama.webp')
          source='https://mythos-grec.floot.app/_cdn/static/5b214aaa-a736-4b77-bff5-687838cfd9ce-mythos-thasos-agora-150-av-jc-source.webp'
          expected='c1811bfd7d8112e4a6d1b737d468a59cc6af08a04c686a33cdeee9a9ad406fb9'
          if path.exists():
              if hashlib.sha256(path.read_bytes()).hexdigest()==expected:
                  print('Déjà publié sur GitHub : octets identiques ; ne pas dupliquer.',flush=True)
                  raise SystemExit(0)
              raise RuntimeError('Conflit : un autre WebP existe déjà, ne jamais écraser.')
          with urlopen(Request(source,headers={'User-Agent':'MYTHOS-Thasos-archaeological-media/1.0'}),timeout=45) as reply:
              data=reply.read()
          digest=hashlib.sha256(data).hexdigest()
          if digest != expected:
              raise RuntimeError(f'Empreinte SHA-256 non conforme : {digest}')
          if not(data[:4]==b'RIFF' and data[8:12]==b'WEBP'):
              raise RuntimeError('En-tête RIFF/WEBP absent')
          with Image.open(BytesIO(data)) as im:
              if im.format!='WEBP' or im.size!=(1672,941):
                  raise RuntimeError(f'Image incorrecte : {im.format} {im.size}')
              im.verify()
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_bytes(data)
          print('Thasos : vrai WebP',len(data),'octets, SHA-256 vérifié',digest,flush=True)
          PY
      - name: Archiver le fichier binaire uniquement, sans modifier les articles
        run: |
          git config user.name "MYTHOS media import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/reconstitutions-3d/thasos-agora-hellenistique-romaine-panorama.webp
          if git diff --cached --quiet; then
            echo "Fichier déjà archivé avec empreinte valide"
            exit 0
          fi
          git commit -m "MYTHOS: importer le WebP photoréaliste original de l'agora de Thasos"
          for n in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "Échec de synchronisation main : publication NON confirmée"
          exit 1
