name: Valider le générateur autonome MYTHOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-native.yml'
      - 'scripts/build_native.py'
      - 'scripts/improve_reading.py'
      - 'scripts/build_reading_pdfs.py'
      - 'scripts/verify_live_site.py'
      - 'scripts/editorial_illustrations.py'
      - 'scripts/editorial_media.json'
      - 'scripts/build_navigation.py'
      - 'scripts/build_greek_corpus.py'
      - 'scripts/build_greek_folders.py'
      - 'scripts/apply_museum_design.py'
      - 'scripts/test_editorial_illustrations.py'
      - 'scripts/editorial_queue.py'
      - 'scripts/publish_site.py'
      - 'scripts/validate_publication.py'
      - 'scripts/verify_publication.py'
      - 'scripts/origines_reconciliation.py'
      - 'editorial/**'
      - 'tests/**'
      - 'chapitres/**'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build_native.py'
      - 'scripts/improve_reading.py'
      - 'scripts/build_reading_pdfs.py'
      - 'scripts/verify_live_site.py'
      - 'scripts/editorial_illustrations.py'
      - 'scripts/editorial_media.json'
      - 'scripts/build_navigation.py'
      - 'scripts/build_greek_corpus.py'
      - 'scripts/build_greek_folders.py'
      - 'scripts/apply_museum_design.py'
      - 'scripts/test_editorial_illustrations.py'
      - 'scripts/editorial_queue.py'
      - 'scripts/publish_site.py'
      - 'scripts/validate_publication.py'
      - 'scripts/verify_publication.py'
      - 'scripts/origines_reconciliation.py'
      - 'editorial/**'
      - 'tests/**'
      - 'chapitres/**'
      - 'assets/mythos-refonte.css'
      - '.github/workflows/test-native.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Préparer le rendu PDF et les polices grecques
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core fonts-urw-base35
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Tester les attributions concurrentes et les reprises
        run: python -m unittest discover -s tests -v
      - name: Vérifier la pertinence et la conservation des illustrations
        run: python -m unittest discover -s scripts -p 'test_editorial_illustrations.py' -v
      - name: Générer le site uniquement depuis GitHub
        run: |
          python scripts/editorial_queue.py apply
          python scripts/build_native.py
          python scripts/verify_publication.py
      - name: Vérifier l'absence de dépendance WordPress
        run: |
          test -f _site/index.html
          test -f _site/rubriques/index.html
          test -f _site/media/2026/10/antigone-libation-rinehart-1870.jpg
          test -f _site/CNAME
          python -c "import json; m=json.load(open('_site/media/manifest.json')); idx=json.load(open('_site/search.json')); assert m['count']==110; assert len(idx)>=500; print('OK:',len(idx),'dossiers,',m['count'],'médias')"
      - name: Vérifier les pages sans imposer de galerie hors sujet
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          pages = [Path('_site/index.html'), Path('_site/grande-encyclopedie/index.html'), Path('_site/theatre/index.html'), Path('_site/philosophie/index.html')]
          for page in pages:
              doc = BeautifulSoup(page.read_text(encoding='utf-8'), 'html.parser')
              assert doc.select_one('article.content'), page
              assert not doc.select_one('aside.mythos-visual-rail'), page
              assert doc.select_one('link[href="/assets/mythos-refonte.css"]'), page
          assert Path('_site/assets/mythos-refonte.css').is_file()
          print('OK : pages et textes conservés, ancienne galerie supprimée')
          PY
      - name: Tester la publication automatique d'un futur chapitre sans le mettre en ligne
        run: |
          cat > chapitres/test-chapitre-technique.md <<'EOF'
          ---
          title: Essai technique non publié
          description: Essai du flux de publication MYTHOS sans WordPress.
          ---

          # Essai technique non publié

          Ce contenu n'est produit que dans le conteneur temporaire de test GitHub Actions.
          Il permet de vérifier que les prochains chapitres Markdown seront automatiquement
          transformés en pages HTML, ajoutés au catalogue, indexés pour la recherche
          et inscrits au sitemap sans accéder à l'API WordPress.com ni à sa médiathèque.
          Il ne doit jamais être commité ni mis en ligne dans l'encyclopédie MYTHOS.
          EOF
          python scripts/build_native.py
          test -f _site/chapitres/test-chapitre-technique/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          items=json.loads(Path('_site/search.json').read_text())
          assert any(x['url']=='/chapitres/test-chapitre-technique/' for x in items)
          assert 'https://bobmythos.fr/chapitres/test-chapitre-technique/' in Path('_site/sitemap.xml').read_text()
          print('OK : nouveau chapitre indexé, test éphémère non publié')
          PY
