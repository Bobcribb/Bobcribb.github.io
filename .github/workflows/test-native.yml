name: Valider le générateur autonome MYTHOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-native.yml'
      - 'scripts/build_native.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Générer le site uniquement depuis GitHub
        run: python scripts/build_native.py
      - name: Vérifier l'absence de dépendance WordPress
        run: |
          test -f _site/index.html
          test -f _site/rubriques/index.html
          test -f _site/media/2026/10/antigone-libation-rinehart-1870.jpg
          test -f _site/CNAME
          python -c "import json; m=json.load(open('_site/media/manifest.json')); idx=json.load(open('_site/search.json')); assert m['count']==110; assert len(idx)>=500; print('OK:',len(idx),'dossiers,',m['count'],'médias')"
