name: Publier MYTHOS depuis GitHub — sans WordPress

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'scripts/build_native.py'
      - 'scripts/build_navigation.py'
      - 'chapitres/**'
      - '**/index.html'
      - 'index.html'
      - 'search.json'
      - 'assets/**'
      - 'media/**'
      - 'CNAME'
  workflow_dispatch:
  schedule:
    # Publication horaire depuis GitHub (n'écrit pas de nouveaux chapitres).
    - cron: '23 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mythos-github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer l'encyclopédie GitHub
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Reconstruire MYTHOS uniquement depuis GitHub
        run: python scripts/build_native.py
      - name: Vérifier les 27 tomes des Origines du sacré avant publication
        run: |
          python - <<'PY'
          from pathlib import Path
          romans = ['i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii','xiii','xiv','xv','xvi','xvii','xviii','xix','xx','xxi','xxii','xxiii','xxiv','xxv','xxvi','xxvii']
          for i, roman in enumerate(romans, 1):
              source = Path(f'chapitres/origines-du-sacre/archives-integrales/tome-{roman}.md')
              rendered = Path(f'_site/chapitres/origines-du-sacre/archives-integrales/tome-{roman}/index.html')
              assert source.is_file() and source.stat().st_size > 10000, f'Tome {i} : source manquante ou incomplète'
              assert rendered.is_file() and rendered.stat().st_size > 10000, f'Tome {i} : page non générée'
          portal = Path('_site/origines-du-sacre/index.html').read_text(encoding='utf-8')
          for roman in romans:
              assert f'/chapitres/origines-du-sacre/archives-integrales/tome-{roman}/' in portal, f'Lien absent : {roman}'
          print('OK : 27 tomes complets, 27 pages générées, 27 liens dans le sommaire')
          PY
      - name: Contrôler l'autonomie de MYTHOS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from bs4 import BeautifulSoup
          docs=json.loads(Path('_site/search.json').read_text())
          media=json.loads(Path('_site/media/manifest.json').read_text())
          assert len(docs)>=500, f"Catalogue incomplet : {len(docs)}"
          assert media['count']==110, f"Médiathèque incomplète : {media['count']}"
          assert len(list(Path('_site/media/2026/10').glob('*')))>=110
          assert Path('_site/CNAME').read_text().strip()=="bobmythos.fr"
          assert Path('_site/akhetaton-horizon-aton-etude/index.html').exists()
          assert '/media/2026/10/' in Path('_site/akhetaton-horizon-aton-etude/index.html').read_text()
          print("OK :",len(docs),"dossiers, 110 médias, aucun appel WordPress")
          PY
      - name: Synchroniser le rendu dans main pour GitHub Pages depuis la branche
        run: |
          cp -a _site/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser le catalogue GitHub autonome MYTHOS [skip ci]"
            # Intégrer les modifications faites pendant la génération
            # avant d'envoyer le catalogue (évite les push non-fast-forward).
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "MYTHOS inchangé"
          fi
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer le site statique
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publier MYTHOS sans WordPress
        id: deployment
        uses: actions/deploy-pages@v4
