name: Publier MYTHOS depuis GitHub — 27 tomes Origines du sacré

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'scripts/build_native.py'
      - 'scripts/improve_reading.py'
      - 'scripts/build_reading_pdfs.py'
      - 'scripts/verify_live_site.py'
      - 'scripts/verify_deployment_head.py'
      - 'scripts/verify_photoreal_gallery.py'
      - 'tests/test_photoreal_gallery.py'
      - 'scripts/editorial_illustrations.py'
      - 'scripts/editorial_media.json'
      - 'scripts/editorial_diagrams.json'
      - 'scripts/editorial_numbering.py'
      - 'EDITORIAL_NUMBERING.json'
      - 'tests/test_editorial_numbering.py'
      - 'scripts/apply_museum_design.py'
      - 'scripts/verify_museum_design.py'
      - 'scripts/publish_site.py'
      - 'scripts/validate_publication.py'
      - 'tests/test_publish_site.py'
      - 'tests/test_site_audit_fixes.py'
      - 'requirements.txt'
      - 'scripts/build_navigation.py'
      - 'scripts/recent_studies.py'
      - 'tests/test_recent_studies.py'
      - 'scripts/build_greek_folders.py'
      - 'scripts/verify_greek_navigation.cjs'
      - 'tests/test_greek_folders.py'
      - 'tests/test_museum_navigation.py'
      - 'scripts/build_greek_corpus.py'
      - 'scripts/origines_reconciliation.py'
      - 'EDITORIAL_REDIRECTS.json'
      - 'editorial/**'
      - 'scripts/comparative_history.py'
      - 'scripts/editorial_queue.py'
      - 'scripts/verify_publication.py'
      - 'tests/test_editorial_queue.py'
      - 'chapitres/**'
      - '**/index.html'
      - 'index.html'
      - 'search.json'
      - 'assets/**'
      - 'media/**'
      - 'CNAME'
      - 'corpus/**'
      - '*.html'
      - '**/*.html'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mythos-github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    # Reconstruction, validations, PDFs et contrôles du site peuvent durer plus de 25 min.
    # Conserver le traitement séquentiel et la validation avant le déploiement.
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer l'encyclopédie GitHub
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Préparer le rendu PDF et les polices grecques
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core fonts-urw-base35
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Tester la synchronisation et les régressions de publication
        run: python -m unittest discover -s tests -v
      - name: Reconstruire, contrôler et synchroniser la dernière version de main
        id: synchronization
        run: python scripts/publish_site.py
      - name: Vérifier le graphisme commun et la conservation des textes
        run: python scripts/verify_museum_design.py
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer le site statique
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Refuser un rendu obsolète après l’envoi de l’artefact
        env:
          MYTHOS_PUBLISHED_SHA: ${{ steps.synchronization.outputs.published_sha }}
        run: python scripts/verify_deployment_head.py
      - name: Publier MYTHOS sans WordPress
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Contrôler les images WebP réellement servies sur le domaine public
        run: python scripts/verify_photoreal_gallery.py --output /tmp/mythos-images-verification.json
      - name: Archiver les preuves de vérification des reconstitutions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mythos-images-verification
          path: /tmp/mythos-images-verification.json
          if-no-files-found: warn
      - name: Contrôler le catalogue et les pages réellement publiées
        run: python scripts/verify_live_site.py --output /tmp/mythos-live-verification.json
      - name: Conserver le contrôle du site public
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mythos-live-verification
          path: /tmp/mythos-live-verification.json
          if-no-files-found: warn
      - name: Préparer les contrôles sur ordinateur, smartphone et tablette
        run: |
          npm install --prefix /tmp/mythos-browser playwright@1.58.2
          /tmp/mythos-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Vérifier les menus et les dossiers sur le domaine public aux trois formats
        env:
          NODE_PATH: /tmp/mythos-browser/node_modules
        run: node scripts/verify_greek_navigation.cjs
      - name: Conserver le rapport et les captures des trois formats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mythos-navigation-responsive
          path: /tmp/mythos-navigation
          if-no-files-found: warn
