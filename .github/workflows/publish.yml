name: Synchroniser MYTHOS vers GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'scripts/build.py'
      - 'scripts/pin_media.py'
      - 'assets/**'
      - 'requirements.txt'
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mythos-github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code MYTHOS
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Générer les pages publiques depuis WordPress
        env:
          SITE_URL: https://bobmythos.fr
          MIN_PAGES: '400'
        run: python scripts/build.py
      - name: Rapatrier et contrôler les 110 médias pour un hébergement autonome
        run: python scripts/pin_media.py
      - name: Conserver le nom de domaine personnalisé
        run: printf 'bobmythos.fr\n' > _site/CNAME
      - name: Synchroniser les fichiers statiques dans main
        run: |
          # GitHub Pages utilise actuellement la branche main en racine.
          # Le site généré doit s'y trouver, pas seulement dans l'artifact Actions.
          cp -a _site/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser le site public MYTHOS [skip ci]"
            git push origin HEAD:main
          else
            echo "Site inchangé."
          fi
      - name: Configurer GitHub Pages pour Actions également
        uses: actions/configure-pages@v5
      - name: Préparer la publication Actions de secours
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Déployer MYTHOS depuis GitHub Actions
        id: deployment
        uses: actions/deploy-pages@v4
