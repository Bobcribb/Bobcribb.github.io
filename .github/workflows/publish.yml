name: Synchroniser MYTHOS vers GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Synchronisation environ une fois par heure (GitHub ne garantit pas l'heure).
    - cron: '23 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mythos-github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4
      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Générer la copie publique MYTHOS
        env:
          SITE_URL: https://bobcribb.github.io
          MIN_PAGES: '400'
        run: python scripts/build.py
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Charger le site statique
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
