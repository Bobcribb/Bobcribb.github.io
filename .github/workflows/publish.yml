name: Publier MYTHOS depuis GitHub — 27 tomes Origines du sacré

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'scripts/build_native.py'
      - 'scripts/editorial_illustrations.py'
      - 'scripts/editorial_media.json'
      - 'scripts/editorial_numbering.py'
      - 'EDITORIAL_NUMBERING.json'
      - 'tests/test_editorial_numbering.py'
      - 'scripts/apply_museum_design.py'
      - 'scripts/verify_museum_design.py'
      - 'scripts/publish_site.py'
      - 'scripts/validate_publication.py'
      - 'tests/test_publish_site.py'
      - 'requirements.txt'
      - 'scripts/build_greek_corpus.py'
      - 'scripts/build_navigation.py'
      - 'scripts/origines_reconciliation.py'
      - 'EDITORIAL_REDIRECTS.json'
      - 'editorial/**'
      - 'scripts/editorial_queue.py'
      - 'scripts/verify_publication.py'
      - 'tests/test_editorial_queue.py'
      - 'chapitres/**'
      - '**/index.html'
      - 'index.html'
      - 'search.json'
      - 'assets/**'
      - 'media/**'
      - 'CNAME'
      - 'corpus/**'
      - '*.html'
      - '**/*.html'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mythos-github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer l'encyclopédie GitHub
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Tester la synchronisation face aux publications concurrentes
        run: python -m unittest discover -s tests -v
      - name: Reconstruire, contrôler et synchroniser la dernière version de main
        id: synchronization
        run: python scripts/publish_site.py
      - name: Vérifier le graphisme commun et la conservation des textes
        run: python scripts/verify_museum_design.py
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer le site statique
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publier MYTHOS sans WordPress
        id: deployment
        uses: actions/deploy-pages@v4
