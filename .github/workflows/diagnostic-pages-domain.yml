name: MYTHOS — diagnostic GitHub Pages et domaine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnostic-pages-domain.yml'

permissions:
  contents: read
  pages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Lire la configuration GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          echo "=== GET /pages ==="
          curl -sS -D /tmp/pages-headers.txt             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2026-03-10"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"             -o /tmp/pages.json || true
          cat /tmp/pages-headers.txt
          cat /tmp/pages.json
          echo
          echo "=== GET /pages/health ==="
          curl -sS -D /tmp/health-headers.txt             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2026-03-10"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/health"             -o /tmp/health.json || true
          cat /tmp/health-headers.txt
          cat /tmp/health.json
          echo
