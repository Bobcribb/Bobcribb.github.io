name: MYTHOS — diagnostic GitHub Pages et domaine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnostic-pages-domain.yml'

permissions:
  contents: read
  pages: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Tester sans effet le droit de mise à jour Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          echo "=== GET /pages ==="
          curl -sS             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2026-03-10"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          echo
          echo "=== PUT /pages build_type=workflow (aucun changement fonctionnel attendu) ==="
          code=$(curl -sS -o /tmp/put.json -w "%{http_code}" -X PUT             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2026-03-10"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"             -d '{"build_type":"workflow"}')
          echo "HTTP $code"
          cat /tmp/put.json
          echo
