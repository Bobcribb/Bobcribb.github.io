name: MYTHOS — importer les deux reconstitutions photoréalistes d'Olympie
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-mythos-olympie-20261104.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mythos-olympie-binary-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le codec WebP
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Importer seulement les vrais fichiers image, avec contrôles
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          import hashlib, urllib.request
          dest = Path("assets/reconstitutions-3d")
          dest.mkdir(parents=True, exist_ok=True)
          assets = [
            ("https://mythos-grec.floot.app/_cdn/static/fb3ac551-a412-4ed7-a3d1-d6ffcdf608be-olympie-heraion-vue-archaique-vers-600-av-jc.webp",
             "509218f285d3871e7612d527f42e7f727f4973c9f14fba594a6b9e8e961c6cc3",
             "olympie-heraion-vue-archaique-vers-600-av-jc.webp", "WEBP"),
            ("https://mythos-grec.floot.app/_cdn/static/f38f7991-a63a-4bd4-ac0e-4be6773686cc-olympie-philippeion-tholos-vers-330-av-jc-source.png",
             "125e94058e1f15fe257083b10dc88ba10e91e4b2ca3166c8fbbd9ac3a2ca1cce",
             "olympie-philippeion-tholos-vers-330-av-jc.webp", "PNG"),
          ]
          for url, expected, filename, original_format in assets:
              path = dest / filename
              if path.exists():
                  if filename.startswith("olympie-heraion-") and hashlib.sha256(path.read_bytes()).hexdigest() == expected:
                      print("Image identique déjà présente:", filename)
                      continue
                  if filename.startswith("olympie-philippeion-"):
                      image = Image.open(path)
                      image.verify()
                      if image.format == "WEBP" and image.size == (1672, 941):
                          print("WebP Philippéion déjà présent; aucun écrasement:", filename)
                          continue
                  raise RuntimeError("Refus d'écraser le fichier existant : " + filename)
              req = urllib.request.Request(url, headers={"User-Agent": "MYTHOS-asset-integrity/1.0"})
              with urllib.request.urlopen(req, timeout=45) as response:
                  raw = response.read()
              digest = hashlib.sha256(raw).hexdigest()
              if digest != expected:
                  raise RuntimeError("Empreinte incorrecte : " + filename + " : " + digest)
              if original_format == "WEBP":
                  image = Image.open(BytesIO(raw))
                  image.verify()
                  with Image.open(BytesIO(raw)) as check:
                      assert check.format == "WEBP" and check.size == (1672, 941)
                  path.write_bytes(raw)
              else:
                  with Image.open(BytesIO(raw)) as image:
                      assert image.format == "PNG" and image.size == (1672, 941)
                      image.convert("RGB").save(path, format="WEBP", quality=89, method=6)
                  with Image.open(path) as check:
                      assert check.format == "WEBP" and check.size == (1672, 941)
              print("WebP valide :", path, path.stat().st_size)
          PY
      - name: Archiver les deux vrais WebP sur main
        run: |
          git config user.name "MYTHOS media import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/reconstitutions-3d/olympie-heraion-vue-archaique-vers-600-av-jc.webp assets/reconstitutions-3d/olympie-philippeion-tholos-vers-330-av-jc.webp
          if git diff --cached --quiet; then
            echo "Les deux fichiers étaient déjà présents, aucune modification."
            exit 0
          fi
          git commit -m "MYTHOS: importer les véritables rendus photoréalistes du Heraion et du Philippeion"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 6
          done
          echo "Échec du transfert vers main ; ne pas considérer les images comme publiées."
          exit 1
