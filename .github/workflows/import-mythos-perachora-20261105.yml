name: MYTHOS — importer l'Heraion de Perachora (WebP photorealiste)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-mythos-perachora-20261105.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mythos-perachora-binary-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Lire la branche principale
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow pour le format WebP
        run: python -m pip install --disable-pip-version-check 'Pillow==12.3.0'
      - name: Importer le rendu valide sans ecraser aucun media
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image
          from io import BytesIO
          import hashlib

          source = "https://mythos-grec.floot.app/_cdn/static/61d69635-afce-4516-b402-1bb37baaaf03-mythos-perachora-heraion-vers-275-av-jc-source.png"
          expected_png = "9c383671266d8df5f7e885cc0b2f1a8d3889c2a0d2255a33287635c6a8a1d977"
          expected_webp = "7eaf28fa8db1ecfb5a6463cb8fb250cd027bec10ebf04dfc1e5db9bdcbbd16b6"
          target = Path("assets/reconstitutions-3d/perachora-heraion-sanctuaire-cotier-vers-275-av-jc.webp")
          if target.exists():
              if hashlib.sha256(target.read_bytes()).hexdigest() == expected_webp:
                  print("WebP deja present : aucun doublon ni remplacement.", flush=True)
                  raise SystemExit(0)
              raise RuntimeError("Refus de remplacer un media existant different.")
          request = Request(source, headers={"User-Agent":"MYTHOS-archaeological-media-integrity/1.0"})
          with urlopen(request, timeout=45) as reply:
              raw = reply.read()
          digest = hashlib.sha256(raw).hexdigest()
          if digest != expected_png:
              raise RuntimeError("SHA-256 de la source PNG incorrect : "+digest)
          with Image.open(BytesIO(raw)) as img:
              if img.format != "PNG" or img.size != (1672, 941):
                  raise RuntimeError("Fichier original non conforme (format/dimensions).")
              target.parent.mkdir(parents=True, exist_ok=True)
              img.convert("RGB").save(target, format="WEBP", quality=88, method=6)
          with Image.open(target) as checked:
              if checked.format != "WEBP" or checked.size != (1672,941):
                  raise RuntimeError("Fichier WebP invalide.")
              checked.verify()
          final_digest = hashlib.sha256(target.read_bytes()).hexdigest()
          print("WebP:",target, "octets:",target.stat().st_size, "sha256:",final_digest,flush=True)
          if final_digest != expected_webp:
              raise RuntimeError("WebP produit different du rendu prepare, ne pas publier.")
          PY
      - name: Inscrire uniquement le WebP dans GitHub main
        run: |
          git config user.name "MYTHOS media import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/reconstitutions-3d/perachora-heraion-sanctuaire-cotier-vers-275-av-jc.webp
          if git diff --cached --quiet; then
            echo "Source deja dans GitHub, aucun changement."
            exit 0
          fi
          git commit -m "MYTHOS: importer l'Heraion de Perachora en WebP photorealiste"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 6
          done
          echo "Transfert binaire non confirme : ne pas ajouter de lien manquant."
          exit 1
