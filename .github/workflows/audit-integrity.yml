name: Audit intégral MYTHOS — sauvegardes et liens

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-integrity.yml'
      - 'scripts/audit_integrity.py'
      - 'scripts/build_native.py'
      - 'scripts/editorial_numbering.py'
      - 'tests/test_editorial_numbering.py'
      - 'EDITORIAL_NUMBERING.json'
      - 'scripts/build_navigation.py'
      - 'chapitres/**'
      - '**/index.html'
      - 'index.html'
      - 'media/**'
      - 'search.json'
  pull_request:
    paths:
      - 'chapitres/**'
      - 'scripts/**'
      - 'EDITORIAL_NUMBERING.json'
      - 'EDITORIAL_REDIRECTS.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Extraire les fichiers sources GitHub
        uses: actions/checkout@v4
      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Tester les références et les liens historiques
        run: python -m unittest discover -s tests -p 'test_editorial_numbering.py' -v
      - name: Générer le site de vérification sans WordPress
        run: python scripts/build_native.py
      - name: Auditer tous les liens, pages, médias et sommes SHA-256
        run: python scripts/audit_integrity.py
      - name: Valider la syntaxe JavaScript de la recherche
        run: node --check _site/assets/search.js
