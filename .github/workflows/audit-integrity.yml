name: Audit intégral MYTHOS — sauvegardes et liens

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-integrity.yml'
      - 'scripts/audit_integrity.py'
      - 'scripts/audit_policy.py'
      - 'scripts/sitemap_integrity.py'
      - 'tests/test_sitemap_integrity.py'
      - 'scripts/build_native.py'
      - 'scripts/editorial_numbering.py'
      - 'tests/test_editorial_numbering.py'
      - 'EDITORIAL_NUMBERING.json'
      - 'scripts/build_navigation.py'
      - 'scripts/recent_studies.py'
      - 'chapitres/**'
      - '**/index.html'
      - '**/*.html'
      - 'assets/**'
      - 'tests/test_site_audit_fixes.py'
      - 'tests/test_audit_*.py'
      - 'index.html'
      - 'media/**'
      - 'search.json'
      - 'CNAME'
  pull_request:
    paths:
      - 'CNAME'
      - 'tests/test_audit_*.py'
      - 'chapitres/**'
      - 'scripts/**'
      - 'EDITORIAL_NUMBERING.json'
      - 'EDITORIAL_REDIRECTS.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Extraire les fichiers sources GitHub
        uses: actions/checkout@v4
      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Tester les références et les liens historiques
        run: python -m unittest discover -s tests -p 'test_editorial_numbering.py' -v
      - name: Contrôler la politique de blocage et les déclencheurs de l'audit
        run: python -m unittest discover -s tests -p 'test_audit_*.py' -v
      - name: Générer le site de vérification sans WordPress
        run: |
          python scripts/editorial_queue.py apply
          python scripts/build_native.py
      - name: Auditer tous les liens, pages, médias et sommes SHA-256
        run: python scripts/audit_integrity.py
      - name: Valider la syntaxe JavaScript de la recherche
        run: node --check _site/assets/search.js
