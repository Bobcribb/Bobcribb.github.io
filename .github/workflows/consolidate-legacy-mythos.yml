name: MYTHOS — consolider ancien depot vers source unique

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-legacy-mythos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mythos-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot principal
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Recuperer l'ancien depot public
        run: git clone --depth 1 https://github.com/Bobcribb/Mythos.git /tmp/mythos-legacy

      - name: Copier uniquement les fichiers absents
        run: |
          set -eu
          rsync -a --ignore-existing             --exclude='.git/'             --exclude='.github/'             /tmp/mythos-legacy/ ./

          mkdir -p docs
          git status --short | awk '{print substr($0,4)}' | sort > /tmp/migrated-paths.txt

          {
            echo '# Consolidation de Bobcribb/Mythos vers Bobcribb/Bobcribb.github.io'
            echo
            echo 'Date : 3 novembre 2026.'
            echo
            echo 'Principe : copie uniquement des fichiers absents ; aucun fichier deja present dans le depot principal n est remplace.'
            echo
            echo 'Exclusions : .git et .github de l ancien depot.'
            echo
            echo 'Le depot Bobcribb/Bobcribb.github.io reste la source unique de publication de bobmythos.fr.'
            echo
            echo '## Fichiers recuperes'
            echo
            sed 's/^/- `/; s/$/`/' /tmp/migrated-paths.txt
          } > docs/consolidation-bobcribb-mythos-2026-11-03.md

      - name: Enregistrer la consolidation
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun fichier nouveau a transferer."
            exit 0
          fi
          git commit -m "Consolider les fichiers uniques de l'ancien depot Mythos"
          git push origin HEAD:main
