name: Vérifier les illustrations et reconstitutions MYTHOS

# Le déploiement GitHub Pages appartient exclusivement à publish.yml.
# Cette vérification ne peut plus écraser le site avec un snapshot antérieur.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-photorealistic-gallery.yml'
      - 'scripts/publish_photorealistic_snapshot.py'
      - 'scripts/editorial_illustrations.py'
      - 'scripts/editorial_media.json'
      - 'scripts/editorial_diagrams.json'
      - 'assets/illustrations-articles/**'
      - 'assets/reconstitutions-3d/**'
      - 'reconstitutions-photorealistes.html'
  pull_request:
    paths:
      - '.github/workflows/publish-photorealistic-gallery.yml'
      - 'scripts/publish_photorealistic_snapshot.py'
      - 'scripts/editorial_illustrations.py'
      - 'scripts/editorial_media.json'
      - 'scripts/editorial_diagrams.json'
      - 'assets/illustrations-articles/**'
      - 'assets/reconstitutions-3d/**'
      - 'reconstitutions-photorealistes.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mythos-photorealistic-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Lire les sources exactes à vérifier
        uses: actions/checkout@v4
      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le parseur HTML
        run: python -m pip install beautifulsoup4==4.12.3
      - name: Contrôler les WebP, notices, licences et l'intégralité du site
        run: python scripts/publish_photorealistic_snapshot.py
      - name: Conserver le catalogue iconographique contrôlé
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mythos-iconographie-validee
          path: |
            _site/assets/reconstitutions-3d/catalogue-photorealiste.json
            _site/assets/illustrations-articles/sources-met.json
          if-no-files-found: warn
