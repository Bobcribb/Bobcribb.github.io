name: Publier les reconstitutions 3D sur bobmythos.fr

# Publication complète et non-mutante, indépendante du travail éditorial horaire.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-photorealistic-gallery.yml'
      - 'scripts/publish_photorealistic_snapshot.py'
      - 'assets/reconstitutions-3d/**'
      - 'reconstitutions-photorealistes.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mythos-photo-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer tout MYTHOS depuis main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Préparer le site complet sans modifier les manuscrits
        run: python scripts/publish_photorealistic_snapshot.py
      - name: Refuser une galerie modifiée pendant le rendu
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git diff --quiet HEAD refs/remotes/origin/main -- assets/reconstitutions-3d/ reconstitutions-photorealistes.html || { echo 'Une image a changé pendant le rendu.'; exit 1; }
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Envoyer tous les fichiers publics
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Déployer le site complet
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Vérifier les WebP et les notices sur bobmythos.fr
        run: python scripts/verify_photoreal_gallery.py --output /tmp/mythos-photo-verification.json
      - name: Sauvegarder la preuve de publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mythos-photo-verification
          path: /tmp/mythos-photo-verification.json
          if-no-files-found: warn
