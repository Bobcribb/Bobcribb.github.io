name: Publier les reconstitutions 3D sur bobmythos.fr

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-photorealistic-gallery.yml'
      - 'assets/reconstitutions-3d/**'
      - 'reconstitutions-photorealistes.html'
      - 'scripts/build_native.py'
      - 'scripts/apply_museum_design.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mythos-gallery-3d
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le domaine MYTHOS (source complète)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances de génération
        run: python -m pip install -r requirements.txt
      - name: Reconstruire toutes les pages du site sans éditer les sources
        run: python scripts/build_native.py
      - name: Contrôler le catalogue photoréaliste et préserver le site
        run: |
          python - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('_site')
          manifest=root/'assets/reconstitutions-3d/catalogue-photorealiste.json'
          page=root/'reconstitutions-photorealistes.html'
          items=json.loads(manifest.read_text(encoding='utf-8'))['entries']
          assert len(items)>=15, f'Corpus tronqué : {len(items)}'
          assert len({x['slug'] for x in items})==len(items), 'Doublon de slug'
          assert page.is_file() and page.stat().st_size>10000, 'Galerie manquante'
          rendered=page.read_text(encoding='utf-8')
          for item in items:
              url=item['src']; assert url.startswith('/assets/reconstitutions-3d/')
              local=root/url.lstrip('/')
              assert local.is_file() and local.stat().st_size>10000, f'Image absente : {local}'
              assert url in rendered, f'Image absente de la galerie : {url}'
              assert 'source_url' in item and item['source_url'].startswith('https://')
          assert (root/'index.html').is_file()
          assert (root/'reconstitutions-antiquite/index.html').is_file()
          assert (root/'CNAME').read_text().strip()=='bobmythos.fr'
          assert len(list(root.rglob('index.html')))>1000, 'Publication du corpus complet non garantie'
          print('MYTHOS :',len(items),'images WebP et notices présentes ; encyclopédie préservée.')
          PY
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer les fichiers du site complet
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Déployer sur bobmythos.fr
        uses: actions/deploy-pages@v4
        id: deployment
